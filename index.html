  <div id="root"></div>

  <!-- 動態繪製圖1風格（粉色立體地球儀、飛機、愛心軌跡、行李箱、登機證）並掛載 Favicon、Apple Touch Icon 與 Web App Manifest -->
  <script>
    (function setupLittleDaysAppIconAndManifest() {
      function generateAppIconDataUrl(size) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const s = size / 512;

        // 1. 圓角方形柔和蜜桃粉漸層底色
        const r = 112 * s;
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.lineTo(size - r, 0);
        ctx.quadraticCurveTo(size, 0, size, r);
        ctx.lineTo(size, size - r);
        ctx.quadraticCurveTo(size, size, size - r, size);
        ctx.lineTo(r, size);
        ctx.quadraticCurveTo(0, size, 0, size - r);
        ctx.lineTo(0, r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.closePath();

        const bgGrad = ctx.createLinearGradient(0, 0, size, size);
        bgGrad.addColorStop(0, '#FFE9DA');
        bgGrad.addColorStop(0.5, '#FFD3C8');
        bgGrad.addColorStop(1, '#F7B7BF');
        ctx.fillStyle = bgGrad;
        ctx.fill();
        ctx.save();
        ctx.clip();

        // 2. 中央立體地球儀與經緯線
        const cx = 256 * s, cy = 248 * s, gr = 205 * s;
        const globeGrad = ctx.createRadialGradient(210 * s, 190 * s, 20 * s, cx, cy, gr);
        globeGrad.addColorStop(0, '#FFF8F2');
        globeGrad.addColorStop(0.65, '#FDE3D2');
        globeGrad.addColorStop(1, '#F5C4B8');
        ctx.fillStyle = globeGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, gr, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 4 * s;
        ctx.strokeStyle = '#C98A74';
        ctx.stroke();

        // 地球儀經緯線
        ctx.strokeStyle = 'rgba(201, 138, 116, 0.38)';
        ctx.lineWidth = 2.5 * s;
        [0.42, 0.78].forEach(rx => {
          ctx.beginPath();
          ctx.ellipse(cx, cy, gr * rx, gr, 0, 0, Math.PI * 2);
          ctx.stroke();
        });
        [-0.45, 0, 0.45].forEach(offset => {
          ctx.beginPath();
          ctx.moveTo(cx - gr * 0.92, cy + gr * offset);
          ctx.quadraticCurveTo(cx, cy + gr * (offset + 0.14), cx + gr * 0.92, cy + gr * offset);
          ctx.stroke();
        });

        // 3. 左下粉色與奶油黃雙色愛心飛行軌跡
        ctx.beginPath();
        ctx.moveTo(0, 420 * s);
        ctx.quadraticCurveTo(110 * s, 330 * s, 210 * s, 290 * s);
        ctx.lineTo(240 * s, 325 * s);
        ctx.quadraticCurveTo(135 * s, 385 * s, 45 * s, 512 * s);
        ctx.closePath();
        const trailGrad = ctx.createLinearGradient(0, 500 * s, 230 * s, 290 * s);
        trailGrad.addColorStop(0, '#F58DA3');
        trailGrad.addColorStop(0.55, '#F9B8B4');
        trailGrad.addColorStop(1, '#FDE2B8');
        ctx.fillStyle = trailGrad;
        ctx.fill();

        // 下方粉色弧形道路與小圓點
        ctx.beginPath();
        ctx.moveTo(115 * s, 512 * s);
        ctx.quadraticCurveTo(220 * s, 360 * s, 465 * s, 370 * s);
        ctx.lineWidth = 22 * s;
        ctx.strokeStyle = '#F699A8';
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.lineWidth = 2.5 * s;
        ctx.setLineDash([8 * s, 8 * s]);
        ctx.strokeStyle = '#FFFDF9';
        ctx.stroke();
        ctx.setLineDash([]);

        // 4. 軌跡上的小愛心
        function drawHeart(hx, hy, hs, fill) {
          ctx.save();
          ctx.translate(hx, hy);
          ctx.scale(hs, hs);
          ctx.beginPath();
          ctx.moveTo(0, 6);
          ctx.bezierCurveTo(-14, -8, -26, 6, 0, 24);
          ctx.bezierCurveTo(26, 6, 14, -8, 0, 6);
          ctx.fillStyle = fill;
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#B87464';
          ctx.stroke();
          ctx.restore();
        }
        drawHeart(108 * s, 366 * s, 0.95 * s, '#F58498');
        drawHeart(62 * s, 422 * s, 0.85 * s, '#F9CE82');

        // 5. 左上角小登機證圖示
        ctx.save();
        ctx.translate(88 * s, 68 * s);
        ctx.rotate(-0.46);
        ctx.fillStyle = '#FFF7F0';
        ctx.strokeStyle = '#C98A74';
        ctx.lineWidth = 3.5 * s;
        ctx.beginPath();
        ctx.roundRect(-56 * s, -30 * s, 112 * s, 60 * s, 14 * s);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#E8A298';
        ctx.fillRect(-40 * s, -12 * s, 42 * s, 6 * s);
        ctx.fillRect(-40 * s, 4 * s, 32 * s, 6 * s);
        ctx.restore();

        // 6. 中央斜飛立體小白飛機
        ctx.save();
        ctx.translate(278 * s, 212 * s);
        ctx.rotate(-0.66);
        // 機翼
        ctx.fillStyle = '#FFFBF7';
        ctx.strokeStyle = '#B87464';
        ctx.lineWidth = 4 * s;
        ctx.beginPath();
        ctx.moveTo(-18 * s, -12 * s);
        ctx.lineTo(-75 * s, -135 * s);
        ctx.quadraticCurveTo(-55 * s, -148 * s, -32 * s, -128 * s);
        ctx.lineTo(38 * s, -15 * s);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-12 * s, 14 * s);
        ctx.lineTo(-65 * s, 138 * s);
        ctx.quadraticCurveTo(-42 * s, 148 * s, -22 * s, 128 * s);
        ctx.lineTo(42 * s, 16 * s);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 尾翼
        ctx.beginPath();
        ctx.moveTo(-132 * s, -6 * s);
        ctx.lineTo(-168 * s, -54 * s);
        ctx.lineTo(-142 * s, -58 * s);
        ctx.lineTo(-105 * s, -8 * s);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 機身
        const planeGrad = ctx.createLinearGradient(0, -34 * s, 0, 34 * s);
        planeGrad.addColorStop(0, '#FFFFFF');
        planeGrad.addColorStop(0.7, '#FDE5DC');
        planeGrad.addColorStop(1, '#F3C1B8');
        ctx.fillStyle = planeGrad;
        ctx.beginPath();
        ctx.ellipse(10 * s, 0, 165 * s, 32 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 駕駛艙與舷窗
        ctx.fillStyle = '#C98A74';
        ctx.beginPath();
        ctx.ellipse(132 * s, -8 * s, 18 * s, 9 * s, 0.2, 0, Math.PI * 2);
        ctx.fill();
        for (let wx = -65; wx <= 85; wx += 22) {
          ctx.beginPath();
          ctx.arc(wx * s, -4 * s, 4.2 * s, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // 7. 右下角圓形行李箱徽章
        ctx.save();
        ctx.translate(422 * s, 412 * s);
        ctx.beginPath();
        ctx.arc(0, 0, 56 * s, 0, Math.PI * 2);
        ctx.fillStyle = '#FFF6EE';
        ctx.fill();
        ctx.lineWidth = 3.5 * s;
        ctx.strokeStyle = '#C98A74';
        ctx.stroke();
        // 行李箱本體
        ctx.strokeRect(-14 * s, -32 * s, 28 * s, 12 * s);
        ctx.fillStyle = '#FAD3C8';
        ctx.beginPath();
        ctx.roundRect(-28 * s, -20 * s, 56 * s, 44 * s, 10 * s);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // 8. 右上角立體星星與閃光
        function drawStar(sx, sy, sr) {
          ctx.save();
          ctx.translate(sx, sy);
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const a1 = (i * 72 - 90) * Math.PI / 180;
            const a2 = (i * 72 + 36 - 90) * Math.PI / 180;
            ctx.lineTo(Math.cos(a1) * sr, Math.sin(a1) * sr);
            ctx.lineTo(Math.cos(a2) * sr * 0.45, Math.sin(a2) * sr * 0.45);
          }
          ctx.closePath();
          ctx.fillStyle = '#FFE0A3';
          ctx.fill();
          ctx.lineWidth = 2.5 * s;
          ctx.strokeStyle = '#C98A74';
          ctx.stroke();
          ctx.restore();
        }
        drawStar(438 * s, 68 * s, 24 * s);

        ctx.restore();
        return canvas.toDataURL('image/png');
      }

      const icon192 = generateAppIconDataUrl(192);
      const icon512 = generateAppIconDataUrl(512);

      // 設定網頁 Favicon 與 iOS/Android 桌面主畫面圖標
      const favicon = document.createElement('link');
      favicon.rel = 'icon';
      favicon.type = 'image/png';
      favicon.href = icon192;
      document.head.appendChild(favicon);

      const appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = icon512;
      document.head.appendChild(appleIcon);

      const manifest = {
        name: "Little Days",
        short_name: "Little Days",
        start_url: ".",
        display: "standalone",
        background_color: "#FBF8F3",
        theme_color: "#FFD3C8",
        description: "Little Days 溫暖日系手帳風旅遊規劃 PWA 應用程式",
        icons: [
          { src: icon192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
          { src: icon512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      const manifestURL = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestURL;
      document.head.appendChild(link);
    })();
  </script>

    function addMinutesToTime(timeStr, minsToAdd) {
      if (!timeStr) return '09:00';
      const [h, m] = timeStr.split(':').map(Number);
      const total = (h * 60 + m + Number(minsToAdd || 0)) % (24 * 60);
      const nh = Math.floor(total / 60);
      const nm = total % 60;
      return `${String(nh).padStart(2, '0')}:${String(nm).padStart(2, '0')}`;
    }

          'X-Goog-FieldMask': 'places.id,places.displayName,places.formattedAddress,places.location,places.types,places.rating,places.userRatingCount',
        },
        body: JSON.stringify({
          textQuery: `${query} ${city}`,
          languageCode: 'zh-TW',
          maxResultCount: 10,
          locationBias: {
            circle: { center: { latitude: cityInfo.lat, longitude: cityInfo.lng }, radius: 30000 },

        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));

    async function planDayWithGemini({ key, city, hotel, items, day }) {
      const prompt =
        `你是專業的旅遊行程規劃師。請為「${city}」的第 ${day} 天，安排下列地點的最佳參觀順序。\n` +
        `出發點(飯店)：${hotel && hotel.name ? hotel.name : '無'}${hotel && hotel.lat ? ` (${hotel.lat}, ${hotel.lng})` : ''}\n` +
        `請考量：地理動線順路、避免來回折返、一般營業時間、用餐時段(午餐約 12:00、晚餐約 18:00)、適合傍晚或夜間造訪的地點排後面。\n` +
        `地點清單(JSON)：${JSON.stringify(items.map((i) => ({ id: i.id, name: i.name, category: i.category, lat: i.lat, lng: i.lng, duration: i.duration })))}\n` +
        `請回傳 JSON：startTime 為第一站建議出發時間(HH:MM)；order 為依序排列的地點陣列，每個包含 id(必須沿用清單中的 id)與 duration(建議停留分鐘數，30~240)；summary 為一句繁體中文的排程說明。所有地點都必須出現一次。`;
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: {
            responseMimeType: 'application/json',
            responseSchema: {
              type: 'OBJECT',
              properties: {
                startTime: { type: 'STRING' },
                summary: { type: 'STRING' },
                order: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: { id: { type: 'STRING' }, duration: { type: 'INTEGER' } },
                    required: ['id'],
                  },
                },
              },
              required: ['order'],
            },
          },
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error((err && err.error && err.error.message) || `HTTP ${res.status}`);
      }
      const data = await res.json();
      const text = data.candidates && data.candidates[0] && data.candidates[0].content.parts.map((p) => p.text || '').join('');
      const parsed = JSON.parse((text || '').replace(/```json|```/g, '').trim());
      const byId = new Map(items.map((i) => [i.id, i]));
      const used = new Set();
      const ordered = [];
      (parsed.order || []).forEach((o) => {
        const base = byId.get(o.id);
        if (!base || used.has(o.id)) return;
        used.add(o.id);
        const dur = Number.isFinite(o.duration) ? Math.min(240, Math.max(30, o.duration)) : base.duration;
        ordered.push({ ...base, duration: dur });
      });
      items.forEach((i) => { if (!used.has(i.id)) ordered.push(i); });
      const startTime = /^\d{2}:\d{2}$/.test(parsed.startTime || '') ? parsed.startTime : '09:30';
      return { ordered, startTime, summary: parsed.summary || '' };
    }

    function recalcDayTimeline(list) {
      if (list.length === 0) return [];
      let cursor = list[0].startTime || '09:30';
      return list.map((item, idx) => {
        const transit = list[idx + 1] ? estimateTransitInfo(item, list[idx + 1]).mins : 15;
        if (idx === 0) {
          cursor = addMinutesToTime(item.startTime || '09:30', item.duration + transit);
          return item;
        }
        const updated = { ...item, startTime: cursor };
        cursor = addMinutesToTime(cursor, item.duration + transit);
        return updated;
      });
    }


    // ===== 插座 / 電壓：與台灣是否通用 =====
    function getPlugCompat(country) {
      const raw = country.plug || '';
      const isTW = country.id === 'TW' || country.currency === 'TWD';
      if (isTW) {
        return { same: true, plugLevel: 'ok', voltLevel: 'ok',
          plugMsg: '與台灣相同，台灣插頭可直接使用', voltMsg: '與台灣相同（110V）',
          summary: '✅ 就在台灣，插頭與電壓都相同，電器可直接使用。' };
      }
      const volM = raw.match(/(\d{2,3})\s*V/i);
      const volt = volM ? Number(volM[1]) : null;
      const typePart = volM ? raw.slice(0, volM.index) : raw;
      const types = Array.from(new Set(typePart.match(/[A-Z]/g) || []));
      const hasA = types.includes('A');
      const hasB = types.includes('B');
      const plugOk = hasA || hasB;

      let plugLevel = 'bad';
      let plugMsg = types.length
        ? `當地為 ${types.join(' / ')} 型插座，台灣插頭（A 型）插不進去，需要轉接頭`
        : '無法判斷插座型式，建議出發前確認並準備萬用轉接頭';
      if (plugOk) {
        plugLevel = hasB ? 'ok' : 'warn';
        plugMsg = hasB
          ? '當地有 A/B 型插座，與台灣相同，插頭可直接插'
          : '當地為 A 型兩孔插座，台灣兩腳插頭可直接插；若是三腳（含接地）插頭需要「三轉二」轉接頭';
      }

      let voltLevel = 'warn';
      let voltMsg = '無法判斷電壓，請查看電器標示';
      if (volt) {
        if (volt <= 127) {
          voltLevel = 'ok';
          voltMsg = volt < 110
            ? `當地 ${volt}V，與台灣 110V 相近，電器可直接用（電熱類功率會略低）`
            : `當地 ${volt}V，與台灣 110V 相近，電器可直接使用`;
        } else {
          voltLevel = 'bad';
          voltMsg = `當地 ${volt}V，高於台灣 110V；只有標示 100-240V 的電器能用，110V 專用電器直接插會損壞`;
        }
      }

      let summary;
      if (plugLevel !== 'bad' && voltLevel === 'ok') summary = '✅ 插頭與電壓都和台灣相近，台灣電器基本上可以直接使用。';
      else if (plugLevel === 'bad' && voltLevel === 'ok') summary = '🔌 電壓相近，只要準備轉接頭，台灣電器就能使用。';
      else if (plugLevel !== 'bad' && voltLevel === 'bad') summary = '⚠️ 插頭可以插，但電壓不同：先看電器標示是否為 INPUT 100-240V，不是的話不能插。';
      else summary = '⚠️ 插頭和電壓都和台灣不同：需要轉接頭，且電器要標示 INPUT 100-240V 才能使用。';
      return { same: false, plugLevel, voltLevel, plugMsg, voltMsg, summary };
    }

    function calcDistanceKm(lat1, lng1, lat2, lng2) {
      if (!lat1 || !lng1 || !lat2 || !lng2) return 1.2;
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLng = ((lng2 - lng1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLng / 2) *
          Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Number((R * c).toFixed(1));
    }

    function estimateTransitInfo(stopA, stopB) {
      const km = calcDistanceKm(stopA.lat, stopA.lng, stopB.lat, stopB.lng);
      if (km <= 1.2) {
        const walkMins = Math.max(4, Math.round(km * 14));
        return { mode: 'walk', label: `🚶 步行約 ${walkMins} 分鐘 (${km} km)`, mins: walkMins };
      } else {
        const transitMins = Math.max(10, Math.round(km * 3.5 + 6));
        return { mode: 'transit', label: `🚃 大眾運輸 / 車程約 ${transitMins} 分鐘 (${km} km)`, mins: transitMins };
      }
    }

    function findCountryForTrip(trip, countriesDB) {

      const byCity = countriesDB.find((c) => c.cities?.some((ct) => ct.name === trip.city));
      return byCity || countriesDB[0];
    }

    function findCityInfo(trip, countriesDB) {
      const country = findCountryForTrip(trip, countriesDB);

    // =========================================================================
    // 4. 互動式 Leaflet 手帳風地圖元件
    // =========================================================================
    function ScrapbookLeafletMap({ center, markers = [], showRoute = false, hotel = null, heightClass = 'h-44' }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const layerGroupRef = useRef(null);

      useEffect(() => {
        if (!mapContainerRef.current || !window.L) return;

        if (!mapInstanceRef.current) {
          const map = window.L.map(mapContainerRef.current, {
            zoomControl: false,
            attributionControl: false,
          }).setView([center.lat, center.lng], 13);

          window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors',
          }).addTo(map);

          layerGroupRef.current = window.L.layerGroup().addTo(map);
          mapInstanceRef.current = map;
        }

        const map = mapInstanceRef.current;
        const layerGroup = layerGroupRef.current;
        layerGroup.clearLayers();

        const boundsPoints = [];

        if (hotel && hotel.lat && hotel.lng) {
          const hotelIcon = window.L.divIcon({
            className: '',
            html: `<div class="custom-pin-badge" style="width:28px;height:28px;background:#C49A45;">🏨</div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14],
          });
          window.L.marker([hotel.lat, hotel.lng], { icon: hotelIcon })
            .bindPopup(`<b>🏨 ${hotel.name}</b><br/><span style="font-size:11px;">住宿飯店</span>`)
            .addTo(layerGroup);
          boundsPoints.push([hotel.lat, hotel.lng]);
        }

        const routeCoords = [];
        markers.forEach((m, idx) => {
          if (!m.lat || !m.lng) return;
          const bg = m.pinColor || '#D67A88';
          const label = m.label !== undefined ? m.label : idx + 1;
          const icon = window.L.divIcon({
            className: '',
            html: `<div class="custom-pin-badge" style="width:28px;height:28px;background:${bg};">${label}</div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14],
          });
          window.L.marker([m.lat, m.lng], { icon })
            .bindPopup(`<b>${m.name}</b><br/><span style="font-size:11px;color:#666;">${m.sub || ''}</span>`)
            .addTo(layerGroup);

          boundsPoints.push([m.lat, m.lng]);
          routeCoords.push([m.lat, m.lng]);
        });

        if (showRoute && routeCoords.length >= 2) {
          window.L.polyline(routeCoords, {
            color: '#6CA2C4',
            weight: 3.5,
            opacity: 0.85,
            dashArray: '7, 7',
          }).addTo(layerGroup);
        }

        if (boundsPoints.length > 0) {
          const bounds = window.L.latLngBounds(boundsPoints);
          map.fitBounds(bounds, { padding: [26, 26], maxZoom: 14 });
        } else {
          map.setView([center.lat, center.lng], 13);
        }

        setTimeout(() => {
          map.invalidateSize();
        }, 120);
      }, [center.lat, center.lng, markers, showRoute, hotel]);

      return (
        <div className={`relative w-full ${heightClass} rounded-2xl overflow-hidden border border-[#E6DFD3] shadow-inner`}>
          <div ref={mapContainerRef} className="w-full h-full" />
          <div className="absolute bottom-2 right-2 z-20 bg-[#FFFDF9]/90 backdrop-blur-xs px-2.5 py-0.5 rounded-full text-[10px] text-[#7D746B] border border-[#E6DFD3]">
            OpenStreetMap · 點擊圖釘看詳情
          </div>
        </div>
      );
    }

    // =========================================================================
    // 6. 主應用程式 (Little Days)
    // =========================================================================
    function App() {
      const [countriesDB, setCountriesDB] = useState(() => {
        try {
          const saved = localStorage.getItem('little_days_countries_v5');
          return saved ? JSON.parse(saved) : INITIAL_COUNTRIES_DB;
        } catch {
          return INITIAL_COUNTRIES_DB;
        }
      });

      const [trips, setTrips] = useState(() => {
        try {
          const saved = localStorage.getItem('little_days_trips_v5');
          return saved ? JSON.parse(saved) : INITIAL_TRIPS;
        } catch {
          return INITIAL_TRIPS;
        }
      });

      const [activeTripId, setActiveTripId] = useState(() => {
        return localStorage.getItem('little_days_active_trip_v5') || INITIAL_TRIPS[0].id;
      });

      const [appSettings, setAppSettings] = useState(() => {
        try {
          const saved = localStorage.getItem('little_days_settings_v5');
          return saved ? JSON.parse(saved) : DEFAULT_SETTINGS;
        } catch {
          return DEFAULT_SETTINGS;
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('little_days_countries_v5', JSON.stringify(countriesDB));
          localStorage.setItem('little_days_trips_v5', JSON.stringify(trips));
          localStorage.setItem('little_days_active_trip_v5', activeTripId);
          localStorage.setItem('little_days_settings_v5', JSON.stringify(appSettings));
        } catch (e) {}
      }, [countriesDB, trips, activeTripId, appSettings]);

      const currentTrip = useMemo(
        () => trips.find((t) => t.id === activeTripId) || trips[0],
        [trips, activeTripId]
      );

      const currentCountry = useMemo(
        () => findCountryForTrip(currentTrip, countriesDB),
        [currentTrip, countriesDB]
      );

      const updateCurrentTrip = useCallback(
        (updater) => {
          setTrips((prev) =>
            prev.map((t) =>
              t.id === currentTrip.id
                ? typeof updater === 'function'
                  ? updater(t)
                  : { ...t, ...updater }
                : t
            )
          );
        },
        [currentTrip.id]
      );

      // 分頁狀態：home | itinerary | accounting | explore | toolkit | tickets
      const [activeTab, setActiveTab] = useState('home');
      const [toolkitSubTab, setToolkitSubTab] = useState('packing');
      const [openQuickExpenseSignal, setOpenQuickExpenseSignal] = useState(0);

      const [selectedDay, setSelectedDay] = useState(1);
      const [homeMode, setHomeMode] = useState('active');
      const [toastMsg, setToastMsg] = useState('');

      const [showNewTripModal, setShowNewTripModal] = useState(false);
      const [showManualSpotModal, setShowManualSpotModal] = useState(false);
      const [manualSpotTarget, setManualSpotTarget] = useState('day');
      const [editingSpot, setEditingSpot] = useState(null);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [activeTicketModal, setActiveTicketModal] = useState(null);

      // 即時天氣狀態
      const [weather, setWeather] = useState({
        loading: true,
        temp: 16,
        high: 19,
        low: 11,
        pop: 10,
        code: 1,
      });

      // 即時匯率狀態 (1 外幣 = ? TWD)
      const [liveRatesToTWD, setLiveRatesToTWD] = useState(() => {
        const init = { TWD: 1 };
        INITIAL_COUNTRIES_DB.forEach((c) => {
          init[c.currency] = c.defaultRate;
        });
        return init;
      });
      const [rateUpdatedTime, setRateUpdatedTime] = useState('剛才同步');
      const [isRefreshingRate, setIsRefreshingRate] = useState(false);

      const showToast = useCallback((msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2500);
      }, []);

      useEffect(() => {
        setSelectedDay(1);
      }, [currentTrip.id]);

      useEffect(() => {
        const cityInfo = findCityInfo(currentTrip, countriesDB);
        setWeather((prev) => ({ ...prev, loading: true }));
        fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${cityInfo.lat}&longitude=${cityInfo.lng}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`
        )
          .then((res) => res.json())
          .then((data) => {
            if (data && data.current) {
              setWeather({
                loading: false,
                temp: Math.round(data.current.temperature_2m),
                high: Math.round(data.daily?.temperature_2m_max?.[0] ?? 19),
                low: Math.round(data.daily?.temperature_2m_min?.[0] ?? 11),
                pop: data.daily?.precipitation_probability_max?.[0] ?? 10,
                code: data.current.weather_code ?? 1,
              });
            }
          })
          .catch(() => setWeather((prev) => ({ ...prev, loading: false })));
      }, [currentTrip, countriesDB]);

      const fetchLiveRates = useCallback(
        (manual = false) => {
          setIsRefreshingRate(true);
          fetch('https://open.er-api.com/v6/latest/TWD')
            .then((res) => res.json())
            .then((data) => {
              if (data && data.rates) {
                const converted = { TWD: 1 };
                countriesDB.forEach((c) => {
                  if (data.rates[c.currency]) {
                    converted[c.currency] = Number((1 / data.rates[c.currency]).toFixed(4));
                  } else {
                    converted[c.currency] = c.defaultRate;
                  }
                });
                setLiveRatesToTWD((prev) => ({ ...prev, ...converted }));
                const now = new Date();
                setRateUpdatedTime(
                  `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} 更新`
                );
                if (manual) showToast('已取得最新即時匯率 ✨');
              }
            })
            .catch(() => {
              if (manual) showToast('目前使用離線快取匯率');
            })
            .finally(() => setIsRefreshingRate(false));
        },
        [countriesDB, showToast]
      );

      useEffect(() => {
        fetchLiveRates(false);
      }, [fetchLiveRates]);

      const cashStats = useMemo(() => {
        const totalInForeign = currentTrip.cashPool.reduce((sum, item) => sum + Number(item.foreignAmount), 0);
        const totalInTWD = currentTrip.cashPool.reduce(
          (sum, item) => sum + Number(item.foreignAmount) * Number(item.rate),
          0
        );
        const avgLockedRate =
          totalInForeign > 0
            ? Number((totalInTWD / totalInForeign).toFixed(4))
            : liveRatesToTWD[currentTrip.currency] || currentCountry.defaultRate || 0.2155;

        const cashSpentForeign = currentTrip.expenses
          .filter((e) => e.method === 'cash')
          .reduce((sum, e) => sum + Number(e.foreignAmount), 0);

        const remainingForeign = Math.max(0, totalInForeign - cashSpentForeign);
        return {
          totalInForeign,
          cashSpentForeign,
          remainingForeign,
          avgLockedRate,
        };
      }, [currentTrip.cashPool, currentTrip.expenses, currentTrip.currency, liveRatesToTWD, currentCountry]);

      const budgetStats = useMemo(() => {
        const spentTWD = currentTrip.expenses.reduce((sum, e) => sum + Number(e.twdAmount), 0);
        const pct = currentTrip.budgetTWD > 0 ? Math.min(100, Math.round((spentTWD / currentTrip.budgetTWD) * 100)) : 0;
        return { spentTWD, pct };
      }, [currentTrip.expenses, currentTrip.budgetTWD]);

      const handleSaveSpot = (patch) => {
        if (!editingSpot) return;
        const { spot, where, day } = editingSpot;
        updateCurrentTrip((t) => {
          if (where === 'pocket') {
            return { ...t, pocketPlaces: t.pocketPlaces.map((p) => (p.id === spot.id ? { ...p, ...patch } : p)) };
          }
          const list = (t.itinerary[day] || []).map((p) => (p.id === spot.id ? { ...p, ...patch } : p));
          return { ...t, itinerary: { ...t.itinerary, [day]: recalcDayTimeline(list) } };
        });
        setEditingSpot(null);
        showToast('已儲存修改 ✨');
      };

      const handleDeleteSpot = (spot, where, day) => {
        updateCurrentTrip((t) => {
          if (where === 'pocket') {
            return { ...t, pocketPlaces: t.pocketPlaces.filter((p) => p.id !== spot.id) };
          }
          const list = (t.itinerary[day] || []).filter((p) => p.id !== spot.id);
          return { ...t, itinerary: { ...t.itinerary, [day]: recalcDayTimeline(list) } };
        });
        setEditingSpot(null);
        showToast('已刪除');
      };

      // ===== 備份：匯出 / 匯入 =====
      const handleExportBackup = async () => {
        const payload = {
          app: 'little-days',
          version: 5,
          exportedAt: new Date().toISOString(),
          countriesDB,
          trips,
          activeTripId,
          appSettings,
        };
        const stamp = new Date().toISOString().slice(0, 10);
        const fileName = `little-days-backup-${stamp}.json`;
        const json = JSON.stringify(payload, null, 2);
        try {
          const file = new File([json], fileName, { type: 'application/json' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Little Days 備份' });
            showToast('已匯出備份檔 💾');
            return;
          }
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
        try {
          const blob = new Blob([json], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          showToast('已匯出備份檔 💾');
        } catch (err) {
          showToast('匯出失敗，請改用 Safari 開啟後再試');
        }
      };

      const handleImportBackup = (file) => {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            const okTrips = Array.isArray(data.trips) && data.trips.length > 0 &&
              data.trips.every((t) => t && t.id && t.itinerary && Array.isArray(t.packingList));
            if (data.app !== 'little-days' || !okTrips) {
              showToast('這不是有效的 Little Days 備份檔');
              return;
            }
            const when = data.exportedAt ? new Date(data.exportedAt).toLocaleString() : '未知時間';
            if (!window.confirm(`匯入「${when}」的備份？\n這會覆蓋目前這支裝置上的全部資料。`)) return;
            setCountriesDB(Array.isArray(data.countriesDB) && data.countriesDB.length ? data.countriesDB : countriesDB);
            setTrips(data.trips);
            setActiveTripId(data.trips.some((t) => t.id === data.activeTripId) ? data.activeTripId : data.trips[0].id);
            if (data.appSettings && Array.isArray(data.appSettings.defaultLuggageItems)) setAppSettings(data.appSettings);
            setShowSettingsModal(false);
            showToast('備份已匯入 ✅');
          } catch (err) {
            showToast('讀取備份檔失敗，檔案可能已損毀');
          }
        };
        reader.readAsText(file);
      };

      const handleAddSpotToTrip = (spotData, destinationType = 'day', targetDay = selectedDay) => {
        const cityInfo = findCityInfo(currentTrip, countriesDB);
        let createdTicketId = '';

        if (spotData.ticketTitle) {
          createdTicketId = `tkt-${Date.now()}`;
        }

        const newSpot = {
          id: `spot-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          name: spotData.name,
          category: spotData.category || appSettings.spotCategories[0] || '景點',
          startTime: spotData.startTime || '10:00',
          duration: Number(spotData.duration) || 60,
          lat: spotData.lat || cityInfo.lat + (Math.random() - 0.5) * 0.02,
          lng: spotData.lng || cityInfo.lng + (Math.random() - 0.5) * 0.02,
          address: spotData.address || `${currentTrip.city}市區`,
          note: spotData.note || '',
          ticketId: createdTicketId,
        };

        updateCurrentTrip((t) => {
          const nextTickets = createdTicketId
            ? [
                {
                  id: createdTicketId,
                  kind: 'attraction',
                  title: spotData.ticketTitle,
                  subtitle: spotData.name,
                  date: t.startDate,
                  code: `TKT-${Math.floor(100000 + Math.random() * 900000)}`,
                  note: spotData.note || '',
                  imageUrl: '',
                },
                ...(t.tickets || []),
              ]
            : t.tickets || [];

          if (destinationType === 'pocket') {
            return {
              ...t,
              tickets: nextTickets,
              pocketPlaces: [newSpot, ...t.pocketPlaces],
            };
          } else {
            const existing = t.itinerary[targetDay] || [];
            const nextList = [...existing, newSpot];
            let cursor = nextList[0]?.startTime || '09:30';
            const recalculated = nextList.map((item, idx) => {
              if (idx === 0) {
                cursor = addMinutesToTime(item.startTime, item.duration + 20);
                return item;
              } else {
                const updatedItem = { ...item, startTime: cursor };
                cursor = addMinutesToTime(cursor, item.duration + 20);
                return updatedItem;
              }
            });
            return {
              ...t,
              tickets: nextTickets,
              itinerary: { ...t.itinerary, [targetDay]: recalculated },
            };
          }
        });

        showToast(
          destinationType === 'pocket'
            ? `已收藏「${newSpot.name}」至待排口袋名單 📌`
            : `已將「${newSpot.name}」排入 Day ${targetDay} 行程 ✨`
        );
      };

      const handleCreateNewTrip = (newTripForm) => {
        const country = countriesDB.find((c) => c.id === newTripForm.countryId) || countriesDB[0];
        const cityObj = country.cities?.find((ct) => ct.name === newTripForm.city) || {
          name: newTripForm.city || country.name,
          lat: 35.6762,
          lng: 139.6503,
          airportName: `${newTripForm.city || country.name}機場`,
        };
        const days = Math.max(1, Math.min(14, Number(newTripForm.daysCount) || 4));
        const emptyItinerary = {};
        for (let d = 1; d <= days; d++) emptyItinerary[d] = [];

        const initialPacking = appSettings.defaultLuggageItems.map((item, idx) => ({
          id: `pack-${Date.now()}-${idx}`,
          category: item.category,
          name: item.name,
          checked: false,
        }));

        const created = {
          id: `trip-${Date.now()}`,
          title: newTripForm.title || `${cityObj.name}自由行 ${days}日 ${country.flag}`,
          countryId: country.id,
          city: cityObj.name,
          startDate: newTripForm.startDate || '2027-01-15',
          endDate: newTripForm.endDate || '2027-01-19',
          daysCount: days,
          currency: country.currency,
          currencySymbol: country.symbol,
          budgetTWD: Number(newTripForm.budgetTWD) || 40000,
          hotel: {
            name: newTripForm.hotelName || `${cityObj.name}市中心精選飯店`,
            address: `${cityObj.name}市中心`,
            checkIn: '15:00',
            checkOut: '11:00',
            bookingNo: `BK-${Math.floor(100000 + Math.random() * 900000)}`,
            roomType: '標準雙人房',
            lat: cityObj.lat,
            lng: cityObj.lng,
          },
          tickets: [
            {
              id: `tkt-out-${Date.now()}`,
              kind: 'flight',
              title: `${cityObj.name} 去程登機證`,
              airline: '自訂去程航空',
              flightNo: 'FL101',
              fromCode: 'TPE',
              fromName: '台北桃園',
              toCode: country.id,
              toName: cityObj.airportName,
              date: newTripForm.startDate || '2027-01-15',
              depTime: '09:00',
              arrTime: '12:30',
              gate: 'A2',
              terminal: 'T1',
              seat: '12A',
              code: `ETKT-${Math.floor(100000 + Math.random() * 900000)}`,
              note: '託運 23kg × 1',
              imageUrl: '',
            },
          ],
          itinerary: emptyItinerary,
          pocketPlaces: [],
          cashPool: [],
          expenses: [],
          packingList: initialPacking,
          shoppingList: [],
        };

        setTrips((prev) => [created, ...prev]);
        setActiveTripId(created.id);
        setShowNewTripModal(false);
        showToast(`已建立新旅程「${created.title}」🎉`);
      };

      const handleUpdateTripMeta = (updatedTripObj) => {
        const country = countriesDB.find((c) => c.id === updatedTripObj.countryId) || countriesDB[0];
        setTrips((prev) =>
          prev.map((t) => {
            if (t.id !== updatedTripObj.id) return t;
            const days = Math.max(1, Math.min(14, Number(updatedTripObj.daysCount) || t.daysCount));
            const nextItin = { ...t.itinerary };
            for (let d = 1; d <= days; d++) {
              if (!nextItin[d]) nextItin[d] = [];
            }
            return {
              ...t,
              title: updatedTripObj.title,
              countryId: country.id,
              city: updatedTripObj.city,
              startDate: updatedTripObj.startDate,
              endDate: updatedTripObj.endDate,
              daysCount: days,
              currency: country.currency,
              currencySymbol: country.symbol,
              budgetTWD: Number(updatedTripObj.budgetTWD) || t.budgetTWD,
              itinerary: nextItin,
            };
          })
        );
        showToast('已更新旅程資訊 ✨');
      };

      const handleDeleteTrip = (tripId) => {
        if (trips.length <= 1) {
          showToast('至少需保留一筆旅遊行程喔！');
          return;
        }
        const remaining = trips.filter((t) => t.id !== tripId);
        setTrips(remaining);
        if (activeTripId === tripId) {
          setActiveTripId(remaining[0].id);
        }
        showToast('已刪除該筆旅程');
      };

      const handleAddCustomCountry = (newCountryObj) => {
        setCountriesDB((prev) => [...prev, newCountryObj]);
        setLiveRatesToTWD((prev) => ({
          ...prev,
          [newCountryObj.currency]: Number(newCountryObj.defaultRate) || 1,
        }));
        showToast(`已新增國家「${newCountryObj.flag} ${newCountryObj.name}」🌍`);
      };

      return (
        <div className="min-h-screen w-full flex justify-center items-start sm:py-5">
          {/* 手機手帳主容器 */}
          <div className="w-full max-w-md min-h-screen sm:min-h-[840px] sm:max-h-[880px] scrapbook-paper sm:rounded-[38px] sm:border-[6px] sm:border-[#FFFDF9] sm:shadow-[0_20px_50px_rgba(74,68,63,0.16)] flex flex-col relative overflow-hidden">

            {/* 全局 Toast 提示 */}
            {toastMsg && (
              <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 max-w-[90vw] bg-[#4A443F]/95 text-[#FFFDF9] px-4 py-2 rounded-full text-xs font-bold shadow-lg flex items-center gap-1.5 animate-bounce">
                <span>✿</span>
                <span className="truncate">{toastMsg}</span>
              </div>
            )}

            {/* 頂部手帳頁眉 & 多行程切換膠囊列（防重疊排版優化） */}
            <header className="px-4 pt-3.5 pb-2.5 bg-[#FBF8F3]/95 backdrop-blur-md border-b border-[#EAE2D6] sticky top-0 z-30">
              <div className="flex items-center justify-between gap-2 mb-2">
                <div className="min-w-0 flex-1">
                  <div className="text-[10px] tracking-widest text-[#9A9086] font-black uppercase">
                    LITTLE DAYS · TRAVEL JOURNAL
                  </div>
                  <h1 className="text-sm sm:text-base font-black text-[#4A443F] flex items-center gap-1.5 mt-0.5">
                    <span className="truncate">{currentTrip.title}</span>
                    <SakuraStamp />
                  </h1>
                </div>

                <div className="flex items-center gap-1.5 shrink-0">
                  <button
                    onClick={() => setActiveTab('tickets')}
                    className={`px-2.5 py-1.5 rounded-full text-[11px] font-black border transition active:scale-95 ${
                      activeTab === 'tickets'
                        ? 'bg-[#D67A88] text-white border-[#D67A88]'
                        : 'bg-[#F9EED7] text-[#8F6B29] border-[#E8D5AF]'
                    }`}
                    title="電子票券管理"
                  >
                    🎫 票夾
                  </button>
                  <button
                    onClick={() => setShowSettingsModal(true)}
                    className="px-2.5 py-1.5 rounded-full bg-[#FFFDF9] text-[#6E655D] text-[11px] font-bold border border-[#E6DFD3] hover:bg-[#F5F0E6] active:scale-95 transition"
                  >
                    ⚙️ 設定
                  </button>
                  <button
                    onClick={() => setShowNewTripModal(true)}
                    className="px-2.5 py-1.5 rounded-full bg-[#F7DCE0] text-[#8E4A55] text-[11px] font-black border border-[#E8C3C9] hover:bg-[#F2CED4] active:scale-95 transition"
                  >
                    ＋ 旅程
                  </button>
                </div>
              </div>

              {/* 多行程快速切換橫向卷軸 */}
              <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                {trips.map((trip) => {
                  const isActive = trip.id === currentTrip.id;
                  const cObj = findCountryForTrip(trip, countriesDB);
                  return (
                    <button
                      key={trip.id}
                      onClick={() => {
                        setActiveTripId(trip.id);
                        if (activeTab === 'tickets') setActiveTab('home');
                      }}
                      className={`px-3 py-1 rounded-full text-[11px] font-bold whitespace-nowrap transition-all shrink-0 ${
                        isActive
                          ? 'bg-[#D67A88] text-white shadow-2xs'
                          : 'bg-[#FFFDF9] text-[#7D746B] border border-[#E6DFD3]'
                      }`}
                    >
                      {cObj.flag} {trip.city} · {trip.daysCount}日
                    </button>
                  );
                })}
              </div>
            </header>

            {/* 主內容滾動區（底部預留 pb-28 避免與固定導覽列重疊） */}
            <main className="flex-1 overflow-y-auto px-4 pt-3 pb-28 space-y-4">
              {activeTab === 'home' && (
                <HomeView
                  trip={currentTrip}
                  country={currentCountry}
                  updateTrip={updateCurrentTrip}
                  homeMode={homeMode}
                  setHomeMode={setHomeMode}
                  weather={weather}
                  cashStats={cashStats}
                  budgetStats={budgetStats}
                  liveRate={liveRatesToTWD[currentTrip.currency] || currentCountry.defaultRate}
                  onOpenTicket={setActiveTicketModal}
                  onSwitchTab={setActiveTab}
                  onShortcutAction={(action) => {
                    if (action === 'shopping') {
                      setToolkitSubTab('shopping');
                      setActiveTab('toolkit');
                    } else if (action === 'rate') {
                      setToolkitSubTab('ratePlug');
                      setActiveTab('toolkit');
                    } else if (action === 'phrases') {
                      setToolkitSubTab('phrases');
                      setActiveTab('toolkit');
                    } else if (action === 'quickExpense') {
                      setActiveTab('accounting');
                      setOpenQuickExpenseSignal((n) => n + 1);
                    }
                  }}
                  showToast={showToast}
                />
              )}

              {activeTab === 'itinerary' && (
                <ItineraryView
                  trip={currentTrip}
                  country={currentCountry}
                  countriesDB={countriesDB}
                  updateTrip={updateCurrentTrip}
                  selectedDay={selectedDay}
                  setSelectedDay={setSelectedDay}
                  onOpenTicket={setActiveTicketModal}
                  onOpenTicketManager={() => setActiveTab('tickets')}
                  onEditSpot={(spot, day) => setEditingSpot({ spot, where: 'day', day })}
                  onOpenManualSpot={() => {
                    setManualSpotTarget('day');
                    setShowManualSpotModal(true);
                  }}
                  showToast={showToast}
                />
              )}

              {activeTab === 'accounting' && (
                <AccountingView
                  trip={currentTrip}
                  country={currentCountry}
                  updateTrip={updateCurrentTrip}
                  cashStats={cashStats}
                  budgetStats={budgetStats}
                  liveRate={liveRatesToTWD[currentTrip.currency] || currentCountry.defaultRate}
                  rateUpdatedTime={rateUpdatedTime}
                  isRefreshingRate={isRefreshingRate}
                  onRefreshRate={() => fetchLiveRates(true)}
                  selectedDay={selectedDay}
                  openQuickExpenseSignal={openQuickExpenseSignal}
                  showToast={showToast}
                />
              )}

              {activeTab === 'explore' && (
                <ExploreView
                  trip={currentTrip}
                  countriesDB={countriesDB}
                  onAddSpot={handleAddSpotToTrip}
                  onEditSpot={(spot) => setEditingSpot({ spot, where: 'pocket', day: 0 })}
                  onOpenManualSpot={() => {
                    setManualSpotTarget('pocket');
                    setShowManualSpotModal(true);
                  }}
                  spotCategories={appSettings.spotCategories}
                  selectedDay={selectedDay}
                  showToast={showToast}
                />
              )}

              {activeTab === 'toolkit' && (
                <ToolkitView
                  trip={currentTrip}
                  country={currentCountry}
                  countriesDB={countriesDB}
                  updateTrip={updateCurrentTrip}
                  activeTool={toolkitSubTab}
                  setActiveTool={setToolkitSubTab}
                  cashStats={cashStats}
                  liveRatesToTWD={liveRatesToTWD}
                  rateUpdatedTime={rateUpdatedTime}
                  onRefreshRate={() => fetchLiveRates(true)}
                  shoppingCategories={appSettings.shoppingCategories}
                  luggageCategories={appSettings.luggageCategories}
                  selectedDay={selectedDay}
                  showToast={showToast}
                />
              )}

              {activeTab === 'tickets' && (
                <TicketsManagerView
                  trip={currentTrip}
                  updateTrip={updateCurrentTrip}
                  onOpenPreview={setActiveTicketModal}
                  onBack={() => setActiveTab('home')}
                  showToast={showToast}
                />
              )}
            </main>

            {/* 底部固定 5 大導覽列（鎖定於手機螢幕底部） */}
            <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#FFFDF9]/95 backdrop-blur-md border-t border-[#EAE2D6] px-2 pt-2 pb-3 sm:rounded-b-[32px] z-40 shadow-[0_-6px_20px_rgba(74,68,63,0.06)]">
              <div className="grid grid-cols-5 gap-1">
                {[
                  { id: 'home', label: '首頁', emoji: '🏠', activeBg: 'bg-[#F7DCE0] text-[#9E4B58]' },
                  { id: 'itinerary', label: '行程', emoji: '🗓️', activeBg: 'bg-[#F9EED7] text-[#8F6B29]' },
                  { id: 'accounting', label: '記帳', emoji: '💰', activeBg: 'bg-[#F9EED7] text-[#8F6B29]' },
                  { id: 'explore', label: '探索', emoji: '🧭', activeBg: 'bg-[#F7DCE0] text-[#9E4B58]' },
                  { id: 'toolkit', label: '工具箱', emoji: '🎒', activeBg: 'bg-[#DCECF7] text-[#3F7396]' },
                ].map((tab) => {
                  const isActive = activeTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`flex flex-col items-center justify-center py-1.5 rounded-2xl transition-all ${
                        isActive ? `${tab.activeBg} scale-105 font-black shadow-2xs` : 'text-[#8C8278] font-medium hover:bg-[#F5F0E6]'
                      }`}
                    >
                      <span className="text-base leading-none mb-1">{tab.emoji}</span>
                      <span className="text-[11px]">{tab.label}</span>
                    </button>
                  );
                })}
              </div>
            </nav>

            {/* 彈窗 1：建立新旅程 */}
            {showNewTripModal && (
              <NewTripModal
                countriesDB={countriesDB}
                onClose={() => setShowNewTripModal(false)}
                onCreate={handleCreateNewTrip}
              />
            )}

            {/* 編輯景點 */}
            {editingSpot && (
              <EditSpotModal
                key={editingSpot.spot.id}
                spot={editingSpot.spot}
                where={editingSpot.where}
                isFirst={editingSpot.where === 'day' && (currentTrip.itinerary[editingSpot.day] || [])[0]?.id === editingSpot.spot.id}
                spotCategories={appSettings.spotCategories}
                onClose={() => setEditingSpot(null)}
                onSave={handleSaveSpot}
                onDelete={() => handleDeleteSpot(editingSpot.spot, editingSpot.where, editingSpot.day)}
              />
            )}

            {/* 彈窗 2：手動新增景點 */}
            {showManualSpotModal && (
              <ManualSpotModal
                trip={currentTrip}
                defaultTarget={manualSpotTarget}
                defaultDay={selectedDay}
                spotCategories={appSettings.spotCategories}
                onClose={() => setShowManualSpotModal(false)}
                onSubmit={(spotData, target, day) => {
                  handleAddSpotToTrip(spotData, target, day);
                  setShowManualSpotModal(false);
                }}
              />
            )}

            {/* 彈窗 3：設定（含分類、預設行李、票券管理入口、自訂國家、編輯/刪除行程） */}
            {showSettingsModal && (
              <SettingsModal
                settings={appSettings}
                trips={trips}
                activeTripId={currentTrip.id}
                countriesDB={countriesDB}
                onSaveSettings={(next) => {
                  setAppSettings(next);
                  setShowSettingsModal(false);
                  showToast('已儲存設定 ⚙️');
                }}
                onSyncDefaultPackingToTrip={(items, mode) => {
                  const toPack = (item, idx) => ({
                    id: `pack-sync-${Date.now()}-${idx}`,
                    category: item.category,
                    name: item.name,
                    checked: false,
                  });
                  setAppSettings((prev) => ({ ...prev, defaultLuggageItems: items }));
                  if (mode === 'replace') {
                    updateCurrentTrip((t) => ({ ...t, packingList: items.map(toPack) }));
                    showToast('已用預設清單覆蓋目前旅程的行李清單');
                  } else {
                    const have = new Set(currentTrip.packingList.map((p) => `${p.category}|${p.name}`));
                    const fresh = items.filter((i) => !have.has(`${i.category}|${i.name}`));
                    updateCurrentTrip((t) => ({ ...t, packingList: [...t.packingList, ...fresh.map(toPack)] }));
                    showToast(fresh.length ? `已補上 ${fresh.length} 項缺少的行李` : '目前旅程已包含所有預設項目');
                  }
                }}
                onExportBackup={handleExportBackup}
                onImportBackup={handleImportBackup}
                onOpenTicketManager={() => {
                  setShowSettingsModal(false);
                  setActiveTab('tickets');
                }}
                onAddCustomCountry={handleAddCustomCountry}
                onUpdateTripMeta={handleUpdateTripMeta}
                onDeleteTrip={handleDeleteTrip}
                onSelectTrip={(id) => setActiveTripId(id)}
                onClose={() => setShowSettingsModal(false)}
              />
            )}

            {/* 彈窗 4：離線電子票夾全螢幕亮屏檢視 */}
            {activeTicketModal && (
              <TicketWalletModal
                ticket={activeTicketModal}
                onClose={() => setActiveTicketModal(null)}
              />
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 7. 分頁一：首頁 (Home)
    //    - 行中今日儀表板：即時天氣時差 + 最近行程 + 現金錢包 + 預算進度條 + 四大快捷鍵
    //    - 行前倒數模式：未完成行李清單 + 旅行前小提醒
    // =========================================================================
    function HomeView({
      trip,
      country,
      updateTrip,
      homeMode,
      setHomeMode,
      weather,
      cashStats,
      budgetStats,
      liveRate,
      onOpenTicket,
      onSwitchTab,
      onShortcutAction,
      showToast
    }) {
      const day1Stops = trip.itinerary[1] || [];
      const nextStop = day1Stops[0];
      const linkedTicket = nextStop?.ticketId
        ? (trip.tickets || []).find((t) => t.id === nextStop.ticketId)
        : (trip.tickets || [])[0];

      const uncompletedPacking = useMemo(
        () => trip.packingList.filter((item) => !item.checked),
        [trip.packingList]
      );

      const packingTotal = trip.packingList.length;
      const packingDone = packingTotal - uncompletedPacking.length;
      const packingPct = packingTotal > 0 ? Math.round((packingDone / packingTotal) * 100) : 0;

      const daysUntil = useMemo(() => {
        const start = new Date(trip.startDate);
        const now = new Date();
        const diff = Math.ceil((start - now) / (1000 * 60 * 60 * 24));
        return diff > 0 ? diff : 0;
      }, [trip.startDate]);

      const [nowClock, setNowClock] = useState(new Date());
      useEffect(() => {
        const timer = setInterval(() => setNowClock(new Date()), 30000);
        return () => clearInterval(timer);
      }, []);

      const twTimeStr = nowClock.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
      const localClock = new Date(nowClock.getTime() + (country.tzOffset || 0) * 3600 * 1000);
      const localTimeStr = localClock.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });

      const handleQuickCheckPacking = (id) => {
        updateTrip((t) => ({
          ...t,
          packingList: t.packingList.map((i) => (i.id === id ? { ...i, checked: !i.checked } : i)),
        }));
        showToast('已完成一項行李打包 ✓');
      };

      const weatherIcon = weather.code === 0 ? '☀️' : weather.code <= 3 ? '⛅' : weather.code <= 67 ? '🌧️' : '🌤️';

      return (
        <div className="space-y-3.5 animate-card">
          {/* 行前 / 行中模式切換膠囊 */}
          <div className="flex bg-[#FFFDF9] p-1 rounded-full border border-[#E6DFD3] shadow-2xs">
            <button
              onClick={() => setHomeMode('active')}
              className={`flex-1 py-1.5 rounded-full text-xs font-bold transition-all ${
                homeMode === 'active' ? 'bg-[#F9EED7] text-[#8F6B29] shadow-2xs' : 'text-[#8C8278]'
              }`}
            >
              ☀️ 行中今日儀表板
            </button>
            <button
              onClick={() => setHomeMode('pre')}
              className={`flex-1 py-1.5 rounded-full text-xs font-bold transition-all ${
                homeMode === 'pre' ? 'bg-[#F7DCE0] text-[#9E4B58] shadow-2xs' : 'text-[#8C8278]'
              }`}
            >
              🎀 行前倒數準備
            </button>
          </div>

          {homeMode === 'active' ? (
            <>
              {/* 1. 當地即時天氣與時差卡片 */}
              <div>
                <HandDrawnBow color="#C49A45" fillBadge="#F9EED7" />
                <div className="rounded-[28px] bg-[#F9EED7] border border-[#E8D5AF] p-4 relative overflow-hidden shadow-xs">
                  <div className="plaid-corner-butter absolute top-0 right-0 w-24 h-full opacity-60 pointer-events-none" />
                  <div className="relative z-10 flex items-center justify-between gap-2">
                    <div>
                      <span className="px-2.5 py-0.5 rounded-full bg-[#FFFDF9]/90 text-[#8F6B29] text-[11px] font-bold">
                        {country.flag} {trip.city} · 即時氣象
                      </span>
                      <div className="mt-2 flex items-center gap-2">
                        <span className="text-3xl">{weatherIcon}</span>
                        <span className="text-3xl font-black text-[#5C4519]">
                          {weather.loading ? '--' : `${weather.temp}°C`}
                        </span>
                      </div>
                      <div className="text-[11px] font-bold text-[#7A5B22] mt-1">
                        高 {weather.high}° / 低 {weather.low}° · 降雨 {weather.pop}%
                      </div>
                    </div>

                    <div className="text-right bg-[#FFFDF9]/90 px-3 py-2 rounded-2xl border border-[#E8D5AF] shrink-0">
                      <div className="text-[10px] text-[#8F6B29] font-bold">
                        當地時間 ({country.tzOffset >= 0 ? `+${country.tzOffset}` : country.tzOffset}hr)
                      </div>
                      <div className="text-lg font-black text-[#4A443F] leading-tight mt-0.5">{localTimeStr}</div>
                      <div className="text-[10px] text-[#8C8278]">台灣 {twTimeStr}</div>
                    </div>
                  </div>
                </div>
              </div>

              {/* 2. 四大快捷鍵（購物清單、匯率換算、翻譯、快速記帳） */}
              <div className="grid grid-cols-4 gap-2">
                {[
                  { id: 'shopping', emoji: '🛍️', label: '購物清單', bg: 'bg-[#F7DCE0]/75 border-[#E8C3C9] text-[#9E4B58]' },
                  { id: 'rate', emoji: '💱', label: '匯率換算', bg: 'bg-[#F9EED7]/85 border-[#E8D5AF] text-[#8F6B29]' },
                  { id: 'phrases', emoji: '🗣️', label: '旅遊翻譯', bg: 'bg-[#DCECF7]/75 border-[#C2DCEF] text-[#3F7396]' },
                  { id: 'quickExpense', emoji: '✍️', label: '快速記帳', bg: 'bg-[#F7DCE0]/75 border-[#E8C3C9] text-[#9E4B58]' },
                ].map((sc) => (
                  <button
                    key={sc.id}
                    onClick={() => onShortcutAction(sc.id)}
                    className={`rounded-2xl border py-2.5 px-1 flex flex-col items-center justify-center gap-1 shadow-2xs active:scale-95 transition ${sc.bg}`}
                  >
                    <span className="text-lg leading-none">{sc.emoji}</span>
                    <span className="text-[11px] font-black">{sc.label}</span>
                  </button>
                ))}
              </div>

              {/* 備忘錄 */}
              <HomeMemo trip={trip} updateTrip={updateTrip} showToast={showToast} />

              {/* 3. 最近行程卡片 */}
              {nextStop && (
                <div className="rounded-[26px] bg-[#FFFDF9] border border-[#E6DFD3] p-4 shadow-2xs">
                  <div className="flex items-center justify-between gap-2 mb-1.5">
                    <span className="px-2.5 py-0.5 rounded-full bg-[#F7DCE0] text-[#9E4B58] text-[11px] font-bold">
                      ⏰ 最近行程 · Day 1 {nextStop.startTime}
                    </span>
                    <button
                      onClick={() => onSwitchTab('itinerary')}
                      className="text-[11px] font-bold text-[#8F6B29] hover:underline shrink-0"
                    >
                      完整行程 →
                    </button>
                  </div>
                  <h3 className="text-sm font-black text-[#4A443F] flex items-center gap-1.5">
                    <span>{getCategoryEmoji(nextStop.category)}</span>
                    <span className="truncate">{nextStop.name}</span>
                  </h3>
                  <p className="text-xs text-[#7D746B] mt-1 line-clamp-1">{nextStop.note || nextStop.address}</p>

                  <div className="mt-3 pt-2.5 border-t border-[#F0EAE0] flex items-center gap-2">
                    {linkedTicket ? (
                      <button
                        onClick={() => onOpenTicket(linkedTicket)}
                        className="flex-1 py-2 px-3 rounded-full bg-[#F9EED7] text-[#8F6B29] text-xs font-black border border-[#E8D5AF] active:scale-95 transition truncate"
                      >
                        🎫 開啟票券 QR
                      </button>
                    ) : (
                      <button
                        onClick={() => onSwitchTab('tickets')}
                        className="flex-1 py-2 px-3 rounded-full bg-[#F5F0E6] text-[#6E655D] text-xs font-bold"
                      >
                        🎫 檢視票券夾
                      </button>
                    )}
                    <a
                      href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(nextStop.name + ' ' + trip.city)}`}
                      target="_blank"
                      rel="noreferrer"
                      className="px-3.5 py-2 rounded-full bg-[#DCECF7] text-[#3F7396] text-xs font-bold shrink-0"
                    >
                      導航 ↗
                    </a>
                  </div>
                </div>
              )}

              {/* 4. 現金錢包 & 行程總預算進度條 */}
              <div className="rounded-[26px] bg-[#FFFDF9] border border-[#E6DFD3] p-4 shadow-2xs space-y-3">
                <div className="flex items-center justify-between gap-2 pb-2.5 border-b border-[#F0EAE0]">
                  <div>
                    <div className="text-[11px] font-bold text-[#8C8278]">
                      💵 現金錢包 ({country.flag} {country.currencyZh})
                    </div>
                    <div className="text-lg font-black text-[#4A443F] mt-0.5">
                      {trip.currencySymbol} {cashStats.remainingForeign.toLocaleString()}
                    </div>
                  </div>
                  <div className="text-right">
                    <div className="text-[10px] font-bold text-[#9E4B58] bg-[#F7DCE0]/60 px-2.5 py-0.5 rounded-full">
                      鎖定匯率 {cashStats.avgLockedRate}
                    </div>
                    <div className="text-[10px] text-[#8C8278] mt-1">
                      即時匯率 {liveRate}
                    </div>
                  </div>
                </div>

                <div>
                  <div className="flex justify-between items-center text-xs font-bold mb-1.5">
                    <span className="text-[#4A443F]">💰 行程總預算進度</span>
                    <span className="text-[#8F6B29]">
                      NT$ {budgetStats.spentTWD.toLocaleString()} / {trip.budgetTWD.toLocaleString()} ({budgetStats.pct}%)
                    </span>
                  </div>
                  <div className="w-full h-2.5 bg-[#F5F0E6] rounded-full overflow-hidden">
                    <div
                      className="h-full bg-[#C49A45] rounded-full transition-all duration-500"
                      style={{ width: `${budgetStats.pct}%` }}
                    />
                  </div>
                </div>
              </div>
            </>
          ) : (
            /* 行前倒數模式：未完成行李清單 + 旅行前小提醒 */
            <>
              <div>
                <HandDrawnBow color="#D67A88" fillBadge="#F7DCE0" />
                <div className="rounded-[28px] bg-[#F7DCE0] border border-[#E8C3C9] p-5 relative overflow-hidden shadow-xs">
                  <div className="plaid-corner-pink absolute top-0 right-0 w-24 h-full opacity-60 pointer-events-none" />
                  <div className="relative z-10">
                    <span className="px-2.5 py-0.5 rounded-full bg-[#FFFDF9]/90 text-[#9E4B58] text-[11px] font-bold">
                      ✈️ 距離出發還有
                    </span>
                    <div className="mt-2 flex items-baseline justify-between">
                      <div className="flex items-baseline gap-1.5">
                        <span className="text-4xl font-black text-[#7A3540]">{daysUntil}</span>
                        <span className="text-sm font-bold text-[#9E4B58]">天</span>
                      </div>
                      <span className="text-xs font-bold text-[#7A3540]">
                        行李進度 {packingDone}/{packingTotal} ({packingPct}%)
                      </span>
                    </div>
                    <div className="text-xs font-bold text-[#7A3540] mt-1">
                      {trip.startDate} ~ {trip.endDate} · {country.flag} {trip.city} ({country.name})
                    </div>
                  </div>
                </div>
              </div>

              <div className="rounded-[26px] bg-[#FFFDF9] border border-[#E6DFD3] p-4 shadow-2xs space-y-2.5">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-black text-[#4A443F]">
                    🧳 未完成行李清單 ({uncompletedPacking.length} 項)
                  </span>
                  <button
                    onClick={() => onSwitchTab('toolkit')}
                    className="text-[11px] font-bold text-[#9E4B58] hover:underline"
                  >
                    完整清單 →
                  </button>
                </div>

                {uncompletedPacking.length === 0 ? (
                  <div className="py-4 text-center text-xs font-bold text-[#7A5B22] bg-[#F9EED7]/50 rounded-2xl">
                    🎉 太棒了！所有行李項目都已經打包完成囉！
                  </div>
                ) : (
                  <div className="space-y-1.5 max-h-48 overflow-y-auto">
                    {uncompletedPacking.map((item) => (
                      <div
                        key={item.id}
                        onClick={() => handleQuickCheckPacking(item.id)}
                        className="flex items-center justify-between gap-2 p-2.5 rounded-2xl bg-[#FBF8F3] border border-[#EFE9DE] cursor-pointer hover:bg-[#F7DCE0]/35 transition"
                      >
                        <div className="flex items-center gap-2.5 min-w-0">
                          <span className="w-4 h-4 rounded-full border-2 border-[#D67A88] inline-block shrink-0" />
                          <span className="text-xs font-bold text-[#4A443F] truncate">{item.name}</span>
                        </div>
                        <span className="text-[10px] px-2 py-0.5 rounded-full bg-[#F9EED7] text-[#8F6B29] font-bold shrink-0">
                          {item.category}
                        </span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="rounded-[26px] bg-[#F9EED7]/75 border border-[#E8D5AF] p-4 space-y-2">
                <div className="text-xs font-black text-[#7A5B22]">✿ {country.flag} {country.name}旅行前的小提醒</div>
                <ul className="space-y-1.5 text-xs text-[#6E5D47]">
                  {(country.preTripTips || ['確認護照效期與當地網卡準備就緒。']).map((tip, idx) => (
                    <li key={idx} className="flex items-start gap-2">
                      <span className="text-[#C49A45] font-black">•</span>
                      <span>{tip}</span>
                    </li>
                  ))}
                </ul>
              </div>
            </>
          )}
        </div>
      );
    }

    // =========================================================================
    // 8. 分頁二：行程 (Itinerary)
    //    - 機場與飯店行程顯示導航按鈕樣式與行為與一般景點完全一致
    // =========================================================================
    function ItineraryView({
      trip,
      country,
      countriesDB,
      updateTrip,
      selectedDay,
      setSelectedDay,
      onOpenTicket,
      onOpenTicketManager,
      onOpenManualSpot,
      onEditSpot,
      showToast
    }) {
      const [showMap, setShowMap] = useState(true);
      const [showSmartModal, setShowSmartModal] = useState(false);
      const [selectedPocketIds, setSelectedPocketIds] = useState([]);
      const [isPlanning, setIsPlanning] = useState(false);

      const dayStops = trip.itinerary[selectedDay] || [];
      const cityInfo = findCityInfo(trip, countriesDB);
      const isFirstDay = selectedDay === 1;
      const isLastDay = selectedDay === trip.daysCount;
      const firstStop = dayStops[0];
      const lastStop = dayStops[dayStops.length - 1];

      const flightTickets = (trip.tickets || []).filter((t) => t.kind === 'flight');
      // 依「航程方向」決定顯示位置：去程 → 第一天、回程 → 最後一天
      // 舊資料沒有方向時：多張機票以日期最早者視為去程、最晚者視為回程；只有一張視為去程
      const flightsByTime = [...flightTickets].sort(
        (a, b) => (a.date || '').localeCompare(b.date || '') || (a.depTime || '').localeCompare(b.depTime || '')
      );
      const resolveDir = (t) => {
        const d = getFlightDir(t);
        if (d) return d;
        if (flightsByTime.length >= 2 && t === flightsByTime[flightsByTime.length - 1]) return 'return';
        return 'outbound';
      };
      const outboundFlights = flightsByTime.filter((t) => resolveDir(t) === 'outbound');
      const inboundFlights = flightsByTime.filter((t) => resolveDir(t) === 'return');

      const mapMarkers = useMemo(() => {
        return dayStops.map((s, idx) => ({
          lat: s.lat,
          lng: s.lng,
          name: `${idx + 1}. ${s.name}`,
          sub: `${s.startTime} 抵達 · 停留 ${s.duration} 分鐘`,
          label: idx + 1,
          pinColor: idx % 2 === 0 ? '#D67A88' : '#5A94BA',
        }));
      }, [dayStops]);

      const recalculateTimeline = (list) => {
        if (list.length === 0) return [];
        let cursor = list[0].startTime || '09:30';
        return list.map((item, idx) => {
          if (idx === 0) {
            const transit = list[1] ? estimateTransitInfo(item, list[1]).mins : 15;
            cursor = addMinutesToTime(item.startTime, item.duration + transit);
            return item;
          } else {
            const updated = { ...item, startTime: cursor };
            const transit = list[idx + 1] ? estimateTransitInfo(item, list[idx + 1]).mins : 15;
            cursor = addMinutesToTime(cursor, item.duration + transit);
            return updated;
          }
        });
      };

      const handleMoveStop = (index, direction) => {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= dayStops.length) return;
        const copy = [...dayStops];
        const [removed] = copy.splice(index, 1);
        copy.splice(targetIndex, 0, removed);
        const recalculated = recalculateTimeline(copy);
        updateTrip((t) => ({
          ...t,
          itinerary: { ...t.itinerary, [selectedDay]: recalculated },
        }));
        showToast('已調整順序並重算後續抵達時間 ✨');
      };

      const handleDurationChange = (stopId, delta) => {
        const updated = dayStops.map((s) =>
          s.id === stopId ? { ...s, duration: Math.max(15, s.duration + delta) } : s
        );
        const recalculated = recalculateTimeline(updated);
        updateTrip((t) => ({
          ...t,
          itinerary: { ...t.itinerary, [selectedDay]: recalculated },
        }));
      };

      const handleRemoveStop = (stopId) => {
        const filtered = dayStops.filter((s) => s.id !== stopId);
        const recalculated = recalculateTimeline(filtered);
        updateTrip((t) => ({
          ...t,
          itinerary: { ...t.itinerary, [selectedDay]: recalculated },
        }));
        showToast('已從當日行程移除');
      };

      const handleSmartOptimize = async () => {
        const picked = trip.pocketPlaces.filter((p) => selectedPocketIds.includes(p.id));
        if (picked.length === 0) {
          showToast('請先勾選至少 1 個口袋景點');
          return;
        }
        const pool = [...dayStops, ...picked];
        const applyResult = (sorted, msg) => {
          const optimizedTimeline = recalculateTimeline(sorted);
          updateTrip((t) => ({
            ...t,
            itinerary: { ...t.itinerary, [selectedDay]: optimizedTimeline },
            pocketPlaces: t.pocketPlaces.filter((p) => !selectedPocketIds.includes(p.id)),
          }));
          setSelectedPocketIds([]);
          setShowSmartModal(false);
          showToast(msg);
        };

        const gKey = getGoogleKey();
        if (gKey) {
          setIsPlanning(true);
          try {
            const { ordered, startTime, summary } = await planDayWithGemini({
              key: gKey, city: trip.city, hotel: trip.hotel, items: pool, day: selectedDay,
            });
            const withStart = ordered.map((it, i) => (i === 0 ? { ...it, startTime } : it));
            applyResult(withStart, summary ? `🤖 ${summary}` : `🤖 已由 AI 排入 Day ${selectedDay}！`);
            setIsPlanning(false);
            return;
          } catch (err) {
            showToast(`AI 排程失敗（${err.message}），改用最短距離排序`);
          }
          setIsPlanning(false);
        }

        const rest = [...pool];
        const sorted = [];
        let currLat = trip.hotel?.lat || cityInfo.lat;
        let currLng = trip.hotel?.lng || cityInfo.lng;
        while (rest.length > 0) {
          let bestIdx = 0;
          let bestDist = Infinity;
          rest.forEach((item, i) => {
            const d = calcDistanceKm(currLat, currLng, item.lat, item.lng);
            if (d < bestDist) {
              bestDist = d;
              bestIdx = i;
            }
          });
          const [chosen] = rest.splice(bestIdx, 1);
          sorted.push({ ...chosen, startTime: sorted.length === 0 ? '09:30' : chosen.startTime });
          currLat = chosen.lat;
          currLng = chosen.lng;
        }
        applyResult(sorted, `已依最順路距離自動排入 Day ${selectedDay}！`);
      };

      const buildSearchNavUrl = (placeName) => {
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(placeName + ' ' + trip.city)}`;
      };

      return (
        <div className="space-y-3.5 animate-card">
          {/* 天數選擇器 & 地圖開關 */}
          <div className="flex items-center justify-between gap-2">
            <div className="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5">
              {Array.from({ length: trip.daysCount }, (_, i) => i + 1).map((day) => (
                <button
                  key={day}
                  onClick={() => setSelectedDay(day)}
                  className={`px-3.5 py-1.5 rounded-full text-xs font-black transition-all shrink-0 ${
                    selectedDay === day
                      ? 'bg-[#D67A88] text-white shadow-xs'
                      : 'bg-[#FFFDF9] text-[#7D746B] border border-[#E6DFD3]'
                  }`}
                >
                  Day {day}
                </button>
              ))}
            </div>

            <button
              onClick={() => setShowMap(!showMap)}
              className="px-3 py-1.5 rounded-full bg-[#FFFDF9] text-[#6E655D] text-[11px] font-bold border border-[#E6DFD3] whitespace-nowrap shrink-0"
            >
              {showMap ? '🗺️ 收合地圖' : '🗺️ 展開地圖'}
            </button>
          </div>

          {/* 雙快捷功能鈕：手動新增景點 + 智慧排程 */}
          <div className="grid grid-cols-2 gap-2">
            <button
              onClick={onOpenManualSpot}
              className="py-2 px-3 rounded-full bg-[#F7DCE0] text-[#8E4A55] text-xs font-black border border-[#E8C3C9] flex items-center justify-center gap-1 active:scale-95 transition"
            >
              <span>＋ 手動新增景點</span>
            </button>
            <button
              onClick={() => setShowSmartModal(true)}
              className="py-2 px-3 rounded-full bg-[#F9EED7] text-[#8F6B29] text-xs font-black border border-[#E8D5AF] flex items-center justify-center gap-1 active:scale-95 transition"
            >
              <span>✨ 智慧排程 ({trip.pocketPlaces.length})</span>
            </button>
          </div>

          {/* 互動路線地圖 */}
          {showMap && (
            <ScrapbookLeafletMap
              center={{ lat: cityInfo.lat, lng: cityInfo.lng }}
              markers={mapMarkers}
              hotel={trip.hotel}
              showRoute={true}
              heightClass="h-44"
            />
          )}

          {/* Day 1 頂部去程登機證卡片 */}
          {isFirstDay && outboundFlights.map((tkt) => (
            <BoardingPassCard
              key={tkt.id}
              ticket={tkt}
              compact={true}
              onOpenPreview={onOpenTicket}
            />
          ))}

          {/* 時間軸景點卡片 */}
          {dayStops.length === 0 ? (
            <div className="rounded-[26px] bg-[#FFFDF9] border-2 border-dashed border-[#E6DFD3] p-6 text-center space-y-2">
              <div className="text-2xl">🗺️</div>
              <div className="text-xs font-bold text-[#7D746B]">Day {selectedDay} 尚未安排行程</div>
              <button
                onClick={onOpenManualSpot}
                className="px-4 py-1.5 rounded-full bg-[#F7DCE0] text-[#9E4B58] text-xs font-bold"
              >
                ＋ 立即新增第一個景點
              </button>
            </div>
          ) : (
            <div className="space-y-1">
              {dayStops.map((stop, idx) => {
                const nextStop = dayStops[idx + 1];
                const transit = nextStop ? estimateTransitInfo(stop, nextStop) : null;
                const boundTicket = stop.ticketId
                  ? (trip.tickets || []).find((t) => t.id === stop.ticketId)
                  : null;

                return (
                  <React.Fragment key={stop.id}>
                    <div className="rounded-[26px] bg-[#FFFDF9] border border-[#E6DFD3] p-4 shadow-2xs relative">
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-center gap-1.5 flex-wrap">
                          <span className="w-6 h-6 rounded-full bg-[#D67A88] text-white text-xs font-black flex items-center justify-center shrink-0">
                            {idx + 1}
                          </span>
                          <span className="px-2.5 py-0.5 rounded-full bg-[#F9EED7] text-[#8F6B29] text-xs font-black">
                            {stop.startTime}
                          </span>
                          <span className="text-xs font-bold text-[#9A9086]">
                            {getCategoryEmoji(stop.category)} {stop.category}
                          </span>
                        </div>

                        <div className="flex items-center gap-1 shrink-0">
                          <button
                            onClick={() => handleMoveStop(idx, -1)}
                            disabled={idx === 0}
                            className="w-6 h-6 rounded-full bg-[#F5F0E6] text-[#6E655D] text-xs font-bold disabled:opacity-30"
                          >
                            ↑
                          </button>
                          <button
                            onClick={() => handleMoveStop(idx, 1)}
                            disabled={idx === dayStops.length - 1}
                            className="w-6 h-6 rounded-full bg-[#F5F0E6] text-[#6E655D] text-xs font-bold disabled:opacity-30"
                          >
                            ↓
