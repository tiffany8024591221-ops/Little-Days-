                    備份內容：所有旅程（行程、口袋名單、票券、記帳、行李、購物、備忘錄）、設定與自訂國家。不含 Google API Key。匯入會覆蓋目前這支裝置上的全部資料。
                  </p>
                </div>
              )}
            </div>

            <button
              type="button"
              onClick={() => onSaveSettings(draft)}
              className="w-full py-2.5 rounded-full bg-[#D67A88] text-white text-xs font-black shadow-xs"
            >
              儲存全部設定
            </button>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 14. 手動新增景點 Modal
    // =========================================================================
    function ManualSpotModal({ trip, defaultTarget = 'day', defaultDay = 1, spotCategories, onClose, onSubmit }) {
      const [name, setName] = useState('');
      const [category, setCategory] = useState(spotCategories[0] || '景點');
      const [target, setTarget] = useState(defaultTarget);
      const [day, setDay] = useState(defaultDay);
      const [startTime, setStartTime] = useState('10:00');
      const [duration, setDuration] = useState('60');
      const [address, setAddress] = useState('');
      const [note, setNote] = useState('');
      const [ticketTitle, setTicketTitle] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSubmit(
          {
            name: name.trim(),
            category,
            startTime,
            duration: Number(duration) || 60,
            address: address.trim() || `${trip.city}市區`,
            note: note.trim(),
            ticketTitle: ticketTitle.trim(),
          },
          target,
          Number(day)
        );
      };

      return (
        <div className="fixed inset-0 bg-[#4A443F]/45 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
          <form
            onSubmit={handleSubmit}
            className="w-full max-w-md rounded-[30px] bg-[#FFFDF9] border border-[#E6DFD3] p-5 shadow-2xl space-y-3 animate-card"
          >
            <div className="flex items-center justify-between">
              <h3 className="text-base font-black text-[#4A443F]">📍 手動新增景點 / 美食</h3>
              <button type="button" onClick={onClose} className="w-7 h-7 rounded-full bg-[#F5F0E6] text-xs font-bold">✕</button>
            </div>

            <div>
              <label className="text-[11px] font-bold text-[#7D746B]">景點或餐廳名稱</label>
              <input
                type="text"
                required
                placeholder="例如：阿夫利柚子鹽拉麵"
                value={name}
                onChange={(e) => setName(e.target.value)}
                className="w-full mt-1 px-3.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
              />
            </div>

            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="text-[11px] font-bold text-[#7D746B]">分類</label>
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                  className="w-full mt-1 px-3 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                >
                  {spotCategories.map((c) => (
                    <option key={c} value={c}>{c}</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="text-[11px] font-bold text-[#7D746B]">加入位置</label>
                <select
                  value={target}
                  onChange={(e) => setTarget(e.target.value)}
                  className="w-full mt-1 px-3 py-2 rounded-2xl bg-[#F9EED7] border border-[#E8D5AF] text-xs font-black text-[#7A5B22]"
                >
                  <option value="day">直接排入當日行程</option>
                  <option value="pocket">先存入口袋名單</option>
                </select>
              </div>
            </div>

            {target === 'day' && (
              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="text-[11px] font-bold text-[#7D746B]">哪一天</label>
                  <select
                    value={day}
                    onChange={(e) => setDay(e.target.value)}
                    className="w-full mt-1 px-2.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                  >
                    {Array.from({ length: trip.daysCount }, (_, i) => i + 1).map((d) => (
                      <option key={d} value={d}>Day {d}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="text-[11px] font-bold text-[#7D746B]">預計抵達</label>
                  <input
                    type="time"
                    value={startTime}
                    onChange={(e) => setStartTime(e.target.value)}
                    className="w-full mt-1 px-2.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                  />
                </div>
                <div>
                  <label className="text-[11px] font-bold text-[#7D746B]">停留 (分)</label>
                  <input
                    type="number"
                    step="15"
                    min="15"
                    value={duration}
                    onChange={(e) => setDuration(e.target.value)}
                    className="w-full mt-1 px-2.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                  />
                </div>
              </div>
            )}

            <input
              type="text"
              placeholder="地址或地標位置 (選填)"
              value={address}
              onChange={(e) => setAddress(e.target.value)}
              className="w-full px-3.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs"
            />

            <input
              type="text"
              placeholder="綁定票券名稱 (選填，填寫後自動建立電子票券)"
              value={ticketTitle}
              onChange={(e) => setTicketTitle(e.target.value)}
              className="w-full px-3.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs"
            />

            <input
              type="text"
              placeholder="備註 / 必點推薦 (選填)"
              value={note}
              onChange={(e) => setNote(e.target.value)}
              className="w-full px-3.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs"
            />

            <button type="submit" className="w-full py-2.5 rounded-full bg-[#D67A88] text-white text-xs font-black">
              確認新增
            </button>
          </form>
        </div>
      );
    }

    // =========================================================================
    // 15. 建立新旅程 Modal（使用完整國家與貨幣資料庫）
    // =========================================================================
    function NewTripModal({ countriesDB, onClose, onCreate }) {
      const [countryId, setCountryId] = useState(countriesDB[0].id);
      const selectedCountry = useMemo(
        () => countriesDB.find((c) => c.id === countryId) || countriesDB[0],
        [countryId, countriesDB]
      );

      const [city, setCity] = useState(selectedCountry.cities?.[0]?.name || selectedCountry.name);
      const [title, setTitle] = useState('');
      const [startDate, setStartDate] = useState('2027-02-10');
      const [endDate, setEndDate] = useState('2027-02-14');
      const [daysCount, setDaysCount] = useState(5);
      const [budgetTWD, setBudgetTWD] = useState(45000);
      const [hotelName, setHotelName] = useState('');

      useEffect(() => {
        setCity(selectedCountry.cities?.[0]?.name || selectedCountry.name);
      }, [selectedCountry]);

      const handleSubmit = (e) => {
        e.preventDefault();
        onCreate({
          countryId,
          city,
          title,
          startDate,
          endDate,
          daysCount,
          budgetTWD,
          hotelName,
        });
      };

      return (
        <div className="fixed inset-0 bg-[#4A443F]/45 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <form
            onSubmit={handleSubmit}
            className="w-full max-w-md rounded-[30px] bg-[#FFFDF9] border border-[#E6DFD3] p-5 shadow-2xl space-y-3 animate-card"
          >
            <div className="flex items-center justify-between">
              <h3 className="text-base font-black text-[#4A443F]">✈️ 建立新旅遊專案</h3>
              <button type="button" onClick={onClose} className="w-7 h-7 rounded-full bg-[#F5F0E6] text-xs font-bold">✕</button>
            </div>

            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="text-[11px] font-bold text-[#7D746B]">旅遊國家</label>
                <select
                  value={countryId}
                  onChange={(e) => setCountryId(e.target.value)}
                  className="w-full mt-1 px-2.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                >
                  {countriesDB.map((c) => (
                    <option key={c.id} value={c.id}>{c.flag} {c.name} ({c.currency})</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="text-[11px] font-bold text-[#7D746B]">目的地城市</label>
                <input
                  type="text"
                  list="city-suggestions"
                  value={city}
                  onChange={(e) => setCity(e.target.value)}
                  className="w-full mt-1 px-3 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                />
                <datalist id="city-suggestions">
                  {(selectedCountry.cities || []).map((ct) => (
                    <option key={ct.name} value={ct.name} />
                  ))}
                </datalist>
              </div>
            </div>

            <div>
              <label className="text-[11px] font-bold text-[#7D746B]">
                自動對應幣別：{selectedCountry.flag} {selectedCountry.currencyZh} ({selectedCountry.currency} · {selectedCountry.symbol})
              </label>
              <input
                type="text"
                placeholder={`例如：${city}春櫻自由行 ${daysCount}日`}
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                className="w-full mt-1 px-3.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
              />
            </div>

            <div className="grid grid-cols-3 gap-2">
              <div>
                <label className="text-[11px] font-bold text-[#7D746B]">出發日期</label>
                <input
                  type="date"
                  value={startDate}
                  onChange={(e) => setStartDate(e.target.value)}
                  className="w-full mt-1 px-2 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-[11px]"
                />
              </div>
              <div>
                <label className="text-[11px] font-bold text-[#7D746B]">旅遊天數</label>
                <input
                  type="number"
                  min="1"
                  max="14"
                  value={daysCount}
                  onChange={(e) => setDaysCount(e.target.value)}
                  className="w-full mt-1 px-2.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-black"
                />
              </div>
              <div>
                <label className="text-[11px] font-bold text-[#7D746B]">總預算 (TWD)</label>
                <input
                  type="number"
                  step="1000"
                  value={budgetTWD}
                  onChange={(e) => setBudgetTWD(e.target.value)}
                  className="w-full mt-1 px-2.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-black"
                />
              </div>
            </div>

            <div>
              <label className="text-[11px] font-bold text-[#7D746B]">下榻飯店名稱 (作為每日出發起點)</label>
              <input
                type="text"
                placeholder={`例如：${city}市中心精選飯店`}
                value={hotelName}
                onChange={(e) => setHotelName(e.target.value)}
                className="w-full mt-1 px-3.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs"
              />
            </div>

            <button type="submit" className="w-full py-2.5 rounded-full bg-[#D67A88] text-white text-xs font-black">
              建立旅程
            </button>
          </form>
        </div>
      );
    }

    // =========================================================================
    // 16. 離線電子票夾全螢幕亮屏檢視 Modal (Wake Lock API)
    // =========================================================================
    function TicketWalletModal({ ticket, onClose }) {
      const [wakeActive, setWakeActive] = useState(false);

      useEffect(() => {
        let wakeLock = null;
        async function requestWake() {
          try {
            if ('wakeLock' in navigator) {
              wakeLock = await navigator.wakeLock.request('screen');
              setWakeActive(true);
            }
          } catch {}
        }
        requestWake();
        return () => {
          if (wakeLock) wakeLock.release().catch(() => {});
        };
      }, []);

      return (
        <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
          <div className="w-full max-w-sm rounded-[32px] bg-white p-6 text-center space-y-4 shadow-2xl animate-card">
            <div className="flex items-center justify-between">
              <span className="px-3 py-1 rounded-full bg-[#F9EED7] text-[#8F6B29] text-[11px] font-black">
                {wakeActive ? '☀️ 螢幕已自動維持亮屏' : '🎫 離線電子憑證'}
              </span>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-[#F5F0E6] text-xs font-black">✕</button>
            </div>

            <div>
              <h3 className="text-base font-black text-[#4A443F]">{ticket.title}</h3>
              {ticket.kind === 'flight' ? (
                <p className="text-xs font-bold text-[#9E4B58] mt-1">
                  {ticket.airline} {ticket.flightNo} · {ticket.fromCode} → {ticket.toCode} · 座位 {ticket.seat}
                </p>
              ) : (
                <p className="text-xs text-[#7D746B] mt-1">{ticket.subtitle || ticket.note}</p>
              )}
            </div>

            {ticket.imageUrl ? (
              <img src={ticket.imageUrl} alt="票券憑證" className="w-full max-h-60 object-contain rounded-2xl border border-[#E6DFD3]" />
            ) : (
              <div className="mx-auto w-48 h-48 rounded-3xl bg-[#FBF8F3] border-2 border-[#E6DFD3] p-4 flex flex-col items-center justify-center">
                <svg viewBox="0 0 100 100" className="w-32 h-32 fill-[#2B2623]">
                  <rect x="10" y="10" width="25" height="25" />
                  <rect x="15" y="15" width="15" height="15" fill="#FFF" />
                  <rect x="18" y="18" width="9" height="9" />
                  <rect x="65" y="10" width="25" height="25" />
                  <rect x="70" y="15" width="15" height="15" fill="#FFF" />
                  <rect x="73" y="18" width="9" height="9" />
                  <rect x="10" y="65" width="25" height="25" />
                  <rect x="15" y="70" width="15" height="15" fill="#FFF" />
                  <rect x="18" y="73" width="9" height="9" />
                  <rect x="42" y="14" width="8" height="8" />
                  <rect x="45" y="30" width="12" height="12" />
                  <rect x="62" y="45" width="10" height="10" />
                  <rect x="42" y="55" width="14" height="14" />
                  <rect x="70" y="68" width="16" height="16" />
                </svg>
                <span className="mt-2 font-mono text-xs font-black tracking-widest text-[#4A443F]">{ticket.code}</span>
              </div>
            )}

            <button
              onClick={onClose}
              className="w-full py-2.5 rounded-full bg-[#D67A88] text-white text-xs font-black"
            >
              完成掃描並關閉
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
