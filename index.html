                          </button>
                          <button
                            onClick={() => onEditSpot && onEditSpot(stop, selectedDay)}
                            className="w-6 h-6 rounded-full bg-[#F9EED7] text-[#8F6B29] text-xs font-bold"
                          >
                            ✎
                          </button>
                          <button
                            onClick={() => handleRemoveStop(stop.id)}
                            className="w-6 h-6 rounded-full bg-[#F7DCE0]/70 text-[#9E4B58] text-xs font-bold ml-0.5"
                          >
                            ✕
                          </button>
                        </div>
                      </div>

                      <h4 className="text-sm font-black text-[#4A443F] mt-2">{stop.name}</h4>
                      {stop.note && (
                        <div className="mt-1.5 text-xs text-[#6E655D] bg-[#FBF8F3] px-3 py-1.5 rounded-xl border border-[#EFE9DE]">
                          {stop.note}
                        </div>
                      )}

                      <div className="mt-3 pt-2.5 border-t border-[#F0EAE0] flex flex-wrap items-center justify-between gap-2">
                        <div className="flex items-center gap-1.5 bg-[#F5F0E6] px-2.5 py-1 rounded-full">
                          <span className="text-[11px] text-[#7D746B] font-bold">停留</span>
                          <button
                            onClick={() => handleDurationChange(stop.id, -15)}
                            className="w-5 h-5 rounded-full bg-[#FFFDF9] text-[#4A443F] text-xs font-black"
                          >
                            -
                          </button>
                          <span className="text-xs font-black text-[#4A443F] min-w-[44px] text-center">
                            {stop.duration}分
                          </span>
                          <button
                            onClick={() => handleDurationChange(stop.id, 15)}
                            className="w-5 h-5 rounded-full bg-[#FFFDF9] text-[#4A443F] text-xs font-black"
                          >
                            +
                          </button>
                        </div>

                        <div className="flex items-center gap-1.5">
                          {boundTicket && (
                            <button
                              onClick={() => onOpenTicket(boundTicket)}
                              className="px-2.5 py-1 rounded-full bg-[#F9EED7] text-[#8F6B29] text-[11px] font-bold border border-[#E8D5AF]"
                            >
                              🎫 票券
                            </button>
                          )}
                          <a
                            href={buildSearchNavUrl(stop.name)}
                            target="_blank"
                            rel="noreferrer"
                            className="px-2.5 py-1 rounded-full bg-[#DCECF7]/70 text-[#3F7396] text-[11px] font-bold"
                          >
                            導航 ↗
                          </a>
                        </div>
                      </div>
                    </div>

                    {transit && (
                      <div className="py-1.5 pl-6 flex items-center gap-2">
                        <div className="w-0.5 h-5 bg-[#E6DFD3] ml-2.5" />
                        <span className="px-3 py-0.5 rounded-full bg-[#FFFDF9] border border-[#E6DFD3] text-[11px] font-bold text-[#7D746B]">
                          {transit.label}
                        </span>
                      </div>
                    )}
                  </React.Fragment>
                );
              })}
            </div>
          )}

          {/* 最後一站：最後一天導航至機場 / 其餘天數返回飯店（導航按鈕樣式與一般景點一致） */}
          {lastStop && (
            isLastDay ? (
              <div className="rounded-[24px] bg-[#FFFDF9] border border-[#E6DFD3] p-4 flex items-center justify-between gap-2 shadow-2xs">
                <div className="min-w-0">
                  <div className="text-[10px] font-black text-[#9E4B58]">✈️ 最後一天前往機場</div>
                  <div className="text-xs font-black text-[#4A443F] truncate mt-0.5">
                    {lastStop.name} → {cityInfo.airportName}
                  </div>
                </div>
                <a
                  href={buildSearchNavUrl(cityInfo.airportName)}
                  target="_blank"
                  rel="noreferrer"
                  className="px-2.5 py-1 rounded-full bg-[#DCECF7]/70 text-[#3F7396] text-[11px] font-bold shrink-0"
                >
                  導航 ↗
                </a>
              </div>
            ) : (
              trip.hotel && (
                <div className="rounded-[26px] bg-[#FFFDF9] border border-[#E6DFD3] p-4 space-y-2 shadow-2xs">
                  <div className="flex items-center justify-between gap-2">
                    <span className="px-2.5 py-0.5 rounded-full bg-[#F9EED7] text-[#8F6B29] text-[11px] font-bold">
                      🏨 返回下榻飯店
                    </span>
                    <a
                      href={buildSearchNavUrl(trip.hotel.name)}
                      target="_blank"
                      rel="noreferrer"
                      className="px-2.5 py-1 rounded-full bg-[#DCECF7]/70 text-[#3F7396] text-[11px] font-bold shrink-0"
                    >
                      導航 ↗
                    </a>
                  </div>
                  <div className="text-sm font-black text-[#4A443F]">{trip.hotel.name}</div>
                  <div className="text-xs text-[#7D746B]">
                    入住 {trip.hotel.checkIn} · {trip.hotel.address}
                  </div>
                </div>
              )
            )
          )}

          {/* 最後一天底部回程登機證卡片 */}
          {isLastDay && inboundFlights.map((tkt) => (
            <BoardingPassCard
              key={tkt.id}
              ticket={tkt}
              compact={true}
              onOpenPreview={onOpenTicket}
            />
          ))}

          {/* 一鍵智慧排程 Modal */}
          {showSmartModal && (
            <div className="fixed inset-0 bg-[#4A443F]/45 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
              <div className="w-full max-w-md rounded-[30px] bg-[#FFFDF9] border border-[#E6DFD3] p-5 shadow-2xl space-y-3.5 animate-card">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-black text-[#4A443F]">✨ 智慧一鍵排程 (Day {selectedDay})</h3>
                  <button onClick={() => setShowSmartModal(false)} className="w-7 h-7 rounded-full bg-[#F5F0E6] text-xs font-bold">✕</button>
                </div>
                <p className="text-xs text-[#7D746B]">
                  勾選「待排口袋名單」中的景點，將以「{trip.hotel?.name}」為出發起點，{getGoogleKey() ? '由 Gemini AI 依動線、用餐時段與停留時間智慧排程：' : '自動計算最順路順序（到「探索」設定 Google API Key 可啟用 AI 排程）：'}
                </p>

                {trip.pocketPlaces.length === 0 ? (
                  <div className="p-4 rounded-2xl bg-[#FBF8F3] text-center text-xs text-[#9A9086]">
                    目前口袋名單為空，請先至「探索」搜尋並收藏景點！
                  </div>
                ) : (
                  <div className="space-y-2 max-h-56 overflow-y-auto">
                    {trip.pocketPlaces.map((p) => {
                      const checked = selectedPocketIds.includes(p.id);
                      return (
                        <div
                          key={p.id}
                          onClick={() =>
                            setSelectedPocketIds((prev) =>
                              checked ? prev.filter((id) => id !== p.id) : [...prev, p.id]
                            )
                          }
                          className={`p-3 rounded-2xl border cursor-pointer flex items-center justify-between transition ${
                            checked ? 'bg-[#F7DCE0]/65 border-[#D67A88]' : 'bg-[#FBF8F3] border-[#E6DFD3]'
                          }`}
                        >
                          <div className="min-w-0 pr-2">
                            <div className="text-xs font-black text-[#4A443F] truncate">{getCategoryEmoji(p.category)} {p.name}</div>
                            <div className="text-[11px] text-[#7D746B] truncate">{p.address} · 停留 {p.duration} 分</div>
                          </div>
                          <div className={`w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold shrink-0 ${checked ? 'bg-[#D67A88] text-white' : 'border border-[#C9C0B5]'}`}>
                            {checked ? '✓' : ''}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                <button
                  onClick={handleSmartOptimize}
                  disabled={isPlanning}
                  className="w-full py-2.5 rounded-full bg-[#D67A88] text-white text-xs font-black shadow-xs active:scale-95 transition disabled:opacity-60"
                >
                  {isPlanning ? '🤖 AI 規劃中...' : getGoogleKey() ? `🤖 AI 智慧排入 Day ${selectedDay}` : `計算最順路順序並排入 Day ${selectedDay}`}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 9. 分頁三：記帳 (Accounting)
    // =========================================================================
    function AccountingView({
      trip,
      country,
      updateTrip,
      cashStats,
      budgetStats,
      liveRate,
      rateUpdatedTime,
      isRefreshingRate,
      onRefreshRate,
      selectedDay,
      openQuickExpenseSignal,
      showToast
    }) {
      const [subTab, setSubTab] = useState('list');
      const [showAddExpense, setShowAddExpense] = useState(false);
      const [showAddExchange, setShowAddExchange] = useState(false);

      useEffect(() => {
        if (openQuickExpenseSignal > 0) {
          setShowAddExpense(true);
        }
      }, [openQuickExpenseSignal]);

      const [expTitle, setExpTitle] = useState('');
      const [expForeign, setExpForeign] = useState('');
      const [expCategory, setExpCategory] = useState('吃飯');
      const [expMethod, setExpMethod] = useState('cash');
      const [expFee, setExpFee] = useState(true);
      const [manualTWD, setManualTWD] = useState('');

      const [exAmount, setExAmount] = useState('');
      const [exRate, setExRate] = useState(String(liveRate));
      const [exNote, setExNote] = useState('');

      useEffect(() => {
        setExRate(String(liveRate));
      }, [liveRate]);

      const previewTWD = useMemo(() => {
        const amt = Number(expForeign) || 0;
        if (expMethod === 'cash') {
          return Math.round(amt * cashStats.avgLockedRate);
        } else {
          const base = amt * liveRate;
          return Math.round(expFee ? base * 1.015 : base);
        }
      }, [expForeign, expMethod, cashStats.avgLockedRate, liveRate, expFee]);

      const handleSaveExpense = (e) => {
        e.preventDefault();
        const amt = Number(expForeign);
        if (!expTitle.trim() || amt <= 0) return;

        const finalTwd = manualTWD !== '' ? Number(manualTWD) : previewTWD;
        const locked = expMethod === 'cash' ? cashStats.avgLockedRate : liveRate;

        const newExp = {
          id: `exp-${Date.now()}`,
          day: selectedDay,
          title: expTitle.trim(),
          category: expCategory,
          foreignAmount: amt,
          method: expMethod,
          lockedRate: locked,
          feeIncluded: expMethod === 'card' ? expFee : false,
          twdAmount: finalTwd,
          note: '',
        };

        updateTrip((t) => ({
          ...t,
          expenses: [newExp, ...t.expenses],
        }));

        setExpTitle('');
        setExpForeign('');
        setManualTWD('');
        setShowAddExpense(false);
        showToast(
          expMethod === 'cash'
            ? `已記帳並從外幣現金池扣除 ${trip.currencySymbol}${amt.toLocaleString()}！`
            : `已鎖定刷卡匯率 ${locked} 並寫入帳本！`
        );
      };

      const handleSaveExchange = (e) => {
        e.preventDefault();
        const amt = Number(exAmount);
        const r = Number(exRate);
        if (amt <= 0 || r <= 0) return;

        updateTrip((t) => ({
          ...t,
          cashPool: [
            ...t.cashPool,
            {
              id: `ex-${Date.now()}`,
              date: new Date().toISOString().slice(0, 10),
              foreignAmount: amt,
              rate: r,
              note: exNote.trim() || '新增換匯',
            },
          ],
        }));
        setExAmount('');
        setExNote('');
        setShowAddExchange(false);
        showToast(`已存入 ${trip.currencySymbol}${amt.toLocaleString()} 至現金池！`);
      };

      const categoryBreakdown = useMemo(() => {
        const cats = ['吃飯', '飲料', '購物', '交通', '伴手禮', '其他'];
        const colors = ['#D67A88', '#C49A45', '#6CA2C4', '#7BA68C', '#9B89B3', '#9A9086'];
        const total = budgetStats.spentTWD || 1;
        return cats.map((c, idx) => {
          const sum = trip.expenses.filter((e) => e.category === c).reduce((s, e) => s + Number(e.twdAmount), 0);
          return {
            name: c,
            twd: sum,
            pct: Math.round((sum / total) * 100),
            color: colors[idx],
          };
        });
      }, [trip.expenses, budgetStats.spentTWD]);

      return (
        <div className="space-y-4 animate-card">
          <div>
            <HandDrawnBow color="#D67A88" fillBadge="#F7DCE0" />
            <div className="rounded-[28px] bg-[#F7DCE0] border border-[#E8C3C9] p-5 relative overflow-hidden shadow-xs">
              <div className="plaid-corner-pink absolute top-0 right-0 w-24 h-full opacity-55 pointer-events-none" />
              <div className="relative z-10">
                <div className="flex items-center justify-between gap-2">
                  <span className="px-3 py-1 rounded-full bg-[#FFFDF9]/90 text-[#9E4B58] text-[11px] font-black">
                    💵 {country.flag} {country.currencyZh} {trip.currency} 現金池
                  </span>
                  <button
                    onClick={() => setShowAddExchange(true)}
                    className="px-3 py-1 rounded-full bg-[#D67A88] text-white text-[11px] font-bold shadow-2xs active:scale-95 transition shrink-0"
                  >
                    ＋ 新增換匯
                  </button>
                </div>

                <div className="mt-3">
                  <div className="text-[11px] font-bold text-[#8E4A55]">錢包剩餘{country.currencyZh}現金</div>
                  <div className="text-3xl font-black text-[#7A3540] tracking-tight mt-0.5">
                    {trip.currencySymbol} {cashStats.remainingForeign.toLocaleString()}
                  </div>
                </div>

                <div className="mt-2 pt-2 border-t border-[#E8C3C9] flex flex-wrap items-center justify-between gap-1 text-[11px] font-bold text-[#7A3540]">
                  <span>現金鎖定匯率：{cashStats.avgLockedRate}</span>
                  <button
                    onClick={onRefreshRate}
                    className="flex items-center gap-1 bg-[#FFFDF9]/85 px-2.5 py-0.5 rounded-full text-[#8E4A55]"
                  >
                    <span>即時 {country.flag} {country.currencyZh} {liveRate}</span>
                    <span className={isRefreshingRate ? 'animate-spin' : ''}>↻</span>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div className="rounded-[24px] bg-[#FFFDF9] border border-[#E6DFD3] p-3.5 shadow-2xs">
            <div className="flex justify-between items-center text-xs font-bold mb-1.5">
              <span className="text-[#4A443F]">旅遊總預算追蹤</span>
              <span className="text-[#8F6B29]">
                NT$ {budgetStats.spentTWD.toLocaleString()} / {trip.budgetTWD.toLocaleString()} ({budgetStats.pct}%)
              </span>
            </div>
            <div className="w-full h-2.5 bg-[#F5F0E6] rounded-full overflow-hidden">
              <div
                className="h-full bg-[#C49A45] rounded-full transition-all duration-500"
                style={{ width: `${budgetStats.pct}%` }}
              />
            </div>
          </div>

          <div className="flex items-center justify-between gap-2">
            <div className="flex bg-[#FFFDF9] p-1 rounded-full border border-[#E6DFD3]">
              <button
                onClick={() => setSubTab('list')}
                className={`px-3.5 py-1 rounded-full text-xs font-bold ${
                  subTab === 'list' ? 'bg-[#F9EED7] text-[#8F6B29]' : 'text-[#8C8278]'
                }`}
              >
                消費明細 ({trip.expenses.length})
              </button>
              <button
                onClick={() => setSubTab('stats')}
                className={`px-3.5 py-1 rounded-full text-xs font-bold ${
                  subTab === 'stats' ? 'bg-[#F7DCE0] text-[#9E4B58]' : 'text-[#8C8278]'
                }`}
              >
                分類統計
              </button>
            </div>

            <button
              onClick={() => setShowAddExpense(true)}
              className="px-4 py-2 rounded-full bg-[#D67A88] text-white text-xs font-black shadow-xs active:scale-95 transition shrink-0"
            >
              ＋ 記一筆
            </button>
          </div>

          {subTab === 'list' ? (
            <div className="space-y-2">
              {trip.expenses.map((exp) => (
                <div
                  key={exp.id}
                  className="rounded-[24px] bg-[#FFFDF9] border border-[#E6DFD3] p-3.5 flex items-center justify-between gap-2 shadow-2xs"
                >
                  <div className="flex items-center gap-3 min-w-0">
                    <div className="w-10 h-10 rounded-2xl bg-[#FBF8F3] border border-[#EFE9DE] flex items-center justify-center text-lg shrink-0">
                      {getCategoryEmoji(exp.category)}
                    </div>
                    <div className="min-w-0">
                      <div className="text-xs font-black text-[#4A443F] truncate">{exp.title}</div>
                      <div className="text-[11px] text-[#8C8278] mt-0.5 flex items-center gap-1.5 flex-wrap">
                        <span className={`px-2 py-0.2 rounded-full text-[10px] font-bold ${
                          exp.method === 'cash' ? 'bg-[#F9EED7] text-[#8F6B29]' : 'bg-[#F7DCE0] text-[#9E4B58]'
                        }`}>
                          {exp.method === 'cash' ? '💵 現金' : '💳 刷卡'}
                        </span>
                        <span>Day {exp.day}</span>
                        <span>· 匯率 {exp.lockedRate}</span>
                      </div>
                    </div>
                  </div>
                  <div className="text-right shrink-0">
                    <div className="text-sm font-black text-[#4A443F]">
                      - {trip.currencySymbol}{Number(exp.foreignAmount).toLocaleString()}
                    </div>
                    <div className="text-[11px] font-bold text-[#9A9086]">
                      ≈ NT$ {Number(exp.twdAmount).toLocaleString()}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div className="rounded-[26px] bg-[#FFFDF9] border border-[#E6DFD3] p-4 space-y-3">
              <div className="text-xs font-black text-[#4A443F]">各類別支出佔比 (TWD)</div>
              {categoryBreakdown.map((item) => (
                <div key={item.name} className="space-y-1">
                  <div className="flex justify-between text-xs font-bold">
                    <span>{getCategoryEmoji(item.name)} {item.name}</span>
                    <span className="text-[#7D746B]">NT$ {item.twd.toLocaleString()} ({item.pct}%)</span>
                  </div>
                  <div className="w-full h-2.5 bg-[#F5F0E6] rounded-full overflow-hidden">
                    <div
                      className="h-full rounded-full transition-all duration-500"
                      style={{ width: `${item.pct}%`, backgroundColor: item.color }}
                    />
                  </div>
                </div>
              ))}
            </div>
          )}

          {showAddExpense && (
            <div className="fixed inset-0 bg-[#4A443F]/45 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
              <form
                onSubmit={handleSaveExpense}
                className="w-full max-w-md rounded-[30px] bg-[#FFFDF9] border border-[#E6DFD3] p-5 shadow-2xl space-y-3 animate-card"
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-black text-[#4A443F]">✍️ 新增旅遊記帳</h3>
                  <button type="button" onClick={() => setShowAddExpense(false)} className="w-7 h-7 rounded-full bg-[#F5F0E6] text-xs font-bold">✕</button>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-[#7D746B]">消費項目名稱</label>
                  <input
                    type="text"
                    required
                    placeholder="例如：拉麵午餐、便利商店"
                    value={expTitle}
                    onChange={(e) => setExpTitle(e.target.value)}
                    className="w-full mt-1 px-3.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2.5">
                  <div>
                    <label className="text-[11px] font-bold text-[#7D746B]">
                      {country.flag} {country.currencyZh} ({trip.currencySymbol})
                    </label>
                    <input
                      type="number"
                      required
                      min="1"
                      placeholder="1500"
                      value={expForeign}
                      onChange={(e) => setExpForeign(e.target.value)}
                      className="w-full mt-1 px-3.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-sm font-black"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-[#7D746B]">自動換算台幣 (可微調)</label>
                    <input
                      type="number"
                      placeholder={`約 NT$ ${previewTWD}`}
                      value={manualTWD}
                      onChange={(e) => setManualTWD(e.target.value)}
                      className="w-full mt-1 px-3.5 py-2 rounded-2xl bg-[#F9EED7]/60 border border-[#E8D5AF] text-sm font-black text-[#7A5B22]"
                    />
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-[#7D746B]">支付方式</label>
                  <div className="grid grid-cols-2 gap-2 mt-1">
                    <button
                      type="button"
                      onClick={() => setExpMethod('cash')}
                      className={`py-2 px-3 rounded-2xl text-xs font-black border ${
                        expMethod === 'cash'
                          ? 'bg-[#F9EED7] border-[#C49A45] text-[#7A5B22]'
                          : 'bg-[#FBF8F3] border-[#E6DFD3] text-[#8C8278]'
                      }`}
                    >
                      💵 現金 (扣現金池)
                    </button>
                    <button
                      type="button"
                      onClick={() => setExpMethod('card')}
                      className={`py-2 px-3 rounded-2xl text-xs font-black border ${
                        expMethod === 'card'
                          ? 'bg-[#F7DCE0] border-[#D67A88] text-[#9E4B58]'
                          : 'bg-[#FBF8F3] border-[#E6DFD3] text-[#8C8278]'
                      }`}
                    >
                      💳 刷卡 / 行動支付
                    </button>
                  </div>
                  {expMethod === 'cash' ? (
                    <div className="text-[11px] text-[#7A5B22] mt-1 font-bold">
                      ✓ 套用現金池鎖定匯率 {cashStats.avgLockedRate}，並自動扣減錢包餘額
                    </div>
                  ) : (
                    <label className="flex items-center gap-1.5 text-[11px] text-[#9E4B58] font-bold mt-1.5 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={expFee}
                        onChange={(e) => setExpFee(e.target.checked)}
                      />
                      <span>自動加計 1.5% 海外交易手續費 (即時匯率 {liveRate})</span>
                    </label>
                  )}
                </div>

                <div>
                  <label className="text-[11px] font-bold text-[#7D746B]">消費分類</label>
                  <div className="flex flex-wrap gap-1.5 mt-1">
                    {['吃飯', '飲料', '購物', '交通', '伴手禮', '其他'].map((cat) => (
                      <button
                        type="button"
                        key={cat}
                        onClick={() => setExpCategory(cat)}
                        className={`px-3 py-1 rounded-full text-xs font-bold ${
                          expCategory === cat ? 'bg-[#D67A88] text-white' : 'bg-[#F5F0E6] text-[#7D746B]'
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  type="submit"
                  className="w-full py-2.5 rounded-full bg-[#D67A88] text-white text-xs font-black shadow-xs"
                >
                  確認記帳
                </button>
              </form>
            </div>
          )}

          {showAddExchange && (
            <div className="fixed inset-0 bg-[#4A443F]/45 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <form
                onSubmit={handleSaveExchange}
                className="w-full max-w-sm rounded-[30px] bg-[#FFFDF9] border border-[#E6DFD3] p-5 shadow-2xl space-y-3 animate-card"
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-black text-[#4A443F]">
                    💱 新增 {country.flag} {country.currencyZh} 換匯
                  </h3>
                  <button type="button" onClick={() => setShowAddExchange(false)} className="w-7 h-7 rounded-full bg-[#F5F0E6] text-xs font-bold">✕</button>
                </div>
                <div>
                  <label className="text-[11px] font-bold text-[#7D746B]">換入金額 ({trip.currencySymbol})</label>
                  <input
                    type="number"
                    required
                    min="1"
                    placeholder="50000"
                    value={exAmount}
                    onChange={(e) => setExAmount(e.target.value)}
                    className="w-full mt-1 px-3.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-sm font-black"
                  />
                </div>
                <div>
                  <label className="text-[11px] font-bold text-[#7D746B]">實際換匯匯率 (目前即時 {liveRate})</label>
                  <input
                    type="number"
                    step="0.0001"
                    required
                    value={exRate}
                    onChange={(e) => setExRate(e.target.value)}
                    className="w-full mt-1 px-3.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-sm font-black"
                  />
                </div>
                <input
                  type="text"
                  placeholder="備註 (例如：外幣 ATM 提領)"
                  value={exNote}
                  onChange={(e) => setExNote(e.target.value)}
                  className="w-full px-3.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs"
                />
                <button
                  type="submit"
                  className="w-full py-2.5 rounded-full bg-[#D67A88] text-white text-xs font-black"
                >
                  存入外幣現金池
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 10. 分頁四：探索 (Explore)
    // =========================================================================
    function ExploreView({ trip, countriesDB, onAddSpot, onEditSpot, onOpenManualSpot, spotCategories, selectedDay, showToast }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [isSearching, setIsSearching] = useState(false);
      const [osmResults, setOsmResults] = useState([]);
      const [showPocketOnly, setShowPocketOnly] = useState(false);
      const [filterCat, setFilterCat] = useState('全部');

      const cityInfo = findCityInfo(trip, countriesDB);
      const filterTabs = useMemo(() => ['全部', ...spotCategories], [spotCategories]);

      const handleSearchOSM = async (e) => {
        e.preventDefault();
        if (!searchQuery.trim()) return;
        setIsSearching(true);
        const gKey = getGoogleKey();
        if (gKey) {
          try {
            const places = await searchGooglePlaces(searchQuery.trim(), trip.city, cityInfo, gKey);
            if (places.length > 0) {
              const pick = (preferred) => (spotCategories.includes(preferred) ? preferred : spotCategories[0]);
              const mapped = places.map((p, idx) => {
                const types = (p.types || []).join(' ');
                const cat = /restaurant|cafe|coffee|bakery|bar|food|meal|dessert|ice_cream/.test(types)
                  ? pick('美食')
                  : /shopping_mall|store|department_store|supermarket|market/.test(types)
                  ? pick('購物')
                  : pick('景點');
                const ratingText = p.rating ? ` ⭐${p.rating}${p.userRatingCount ? ` (${p.userRatingCount})` : ''}` : '';
                return {
                  id: `gp-${p.id || idx}`,
                  name: (p.displayName && p.displayName.text) || '未命名地點',
                  category: cat,
                  lat: p.location ? p.location.latitude : cityInfo.lat,
                  lng: p.location ? p.location.longitude : cityInfo.lng,
                  address: p.formattedAddress || '',
                  duration: 60,
                  note: `Google 地圖${ratingText}`,
                  isOsm: true,
                };
              });
              setOsmResults(mapped);
              setShowPocketOnly(false);
              showToast(`找到 ${mapped.length} 個「${searchQuery}」相關地點！`);
            } else {
              showToast('Google 找不到相符地點，試試看其他關鍵字！');
            }
            setIsSearching(false);
            return;
          } catch (err) {
            showToast(`Google 搜尋失敗（${err.message}），改用免費搜尋`);
          }
        }
        try {
          const queryWithCity = `${searchQuery.trim()} ${trip.city}`;
          const res = await fetch(
            `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryWithCity)}&limit=6&addressdetails=1`,
            { headers: { 'Accept-Language': 'zh-TW,ja,en' } }
          );
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            const mapped = data.map((item, idx) => {
              const rawName = item.display_name.split(',')[0];
              const isFood = /restaurant|cafe|ramen|sushi|coffee|food/i.test(item.type + item.class);
              const isShop = /shop|mall|department|store/i.test(item.type + item.class);
              const cat = isFood
                ? spotCategories.includes('美食') ? '美食' : spotCategories[0]
                : isShop
                ? spotCategories.includes('購物') ? '購物' : spotCategories[0]
                : spotCategories.includes('景點') ? '景點' : spotCategories[0];
              return {
                id: `osm-${item.place_id || idx}`,
                name: rawName,
                category: cat,
                lat: parseFloat(item.lat),
                lng: parseFloat(item.lon),
                address: item.display_name.split(',').slice(1, 4).join(', '),
                duration: 60,
                note: 'OpenStreetMap 搜尋結果',
                isOsm: true,
              };
            });
            setOsmResults(mapped);
            setShowPocketOnly(false);
            showToast(`找到 ${mapped.length} 個「${searchQuery}」相關地點！`);
          } else {
            showToast('找不到相符地點，試試看其他關鍵字或手動新增！');
          }
        } catch {
          showToast('搜尋連線異常，可使用「手動新增」直接建立');
        } finally {
          setIsSearching(false);
        }
      };

      const displayPlaces = useMemo(() => {
        const base = osmResults.length > 0 && !showPocketOnly ? osmResults : trip.pocketPlaces;
        if (filterCat === '全部') return base;
        return base.filter((p) => p.category === filterCat);
      }, [osmResults, showPocketOnly, trip.pocketPlaces, filterCat]);

      const mapMarkers = useMemo(() => {
        return displayPlaces.map((p) => ({
          lat: p.lat,
          lng: p.lng,
          name: p.name,
          sub: p.address,
          label: getCategoryEmoji(p.category),
          pinColor: '#D67A88',
        }));
      }, [displayPlaces]);

      return (
        <div className="space-y-3.5 animate-card">
          <GoogleKeyPanel showToast={showToast} />
          <form onSubmit={handleSearchOSM} className="flex gap-1.5">
            <input
              type="text"
              placeholder={`搜尋${trip.city}真實景點/餐廳...`}
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="flex-1 min-w-0 px-3.5 py-2.5 rounded-full bg-[#FFFDF9] border border-[#E6DFD3] text-xs font-bold focus:outline-none focus:border-[#D67A88]"
            />
            <button
              type="submit"
              disabled={isSearching}
              className="px-4 py-2.5 rounded-full bg-[#D67A88] text-white text-xs font-black shadow-2xs active:scale-95 transition whitespace-nowrap shrink-0"
            >
              {isSearching ? '搜尋中...' : '🔍 搜尋'}
            </button>
          </form>

          <div className="flex items-center justify-between gap-2">
            <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
              {filterTabs.map((cat) => (
                <button
                  key={cat}
                  onClick={() => setFilterCat(cat)}
                  className={`px-3 py-1 rounded-full text-[11px] font-bold whitespace-nowrap shrink-0 ${
                    filterCat === cat ? 'bg-[#F7DCE0] text-[#9E4B58]' : 'bg-[#FFFDF9] text-[#8C8278] border border-[#E6DFD3]'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>
            <button
              onClick={onOpenManualSpot}
              className="px-3 py-1 rounded-full bg-[#F9EED7] text-[#8F6B29] text-[11px] font-bold whitespace-nowrap border border-[#E8D5AF] shrink-0"
            >
              ＋ 手動新增
            </button>
          </div>

          <ScrapbookLeafletMap
            center={{ lat: cityInfo.lat, lng: cityInfo.lng }}
            markers={mapMarkers}
            hotel={trip.hotel}
            heightClass="h-44"
          />

          <div className="flex items-center gap-1.5 px-1">
            {osmResults.length > 0 && (
              <button
                onClick={() => setShowPocketOnly(false)}
                className={`px-3 py-1.5 rounded-full text-[11px] font-black ${!showPocketOnly ? 'bg-[#D67A88] text-white' : 'bg-[#FFFDF9] text-[#8C8278] border border-[#E6DFD3]'}`}
              >
                🔍 搜尋結果 ({osmResults.length})
              </button>
            )}
            <button
              onClick={() => setShowPocketOnly(true)}
              className={`px-3 py-1.5 rounded-full text-[11px] font-black ${osmResults.length === 0 || showPocketOnly ? 'bg-[#D67A88] text-white' : 'bg-[#FFFDF9] text-[#8C8278] border border-[#E6DFD3]'}`}
            >
              📌 收藏口袋名單 ({trip.pocketPlaces.length})
            </button>
            {osmResults.length > 0 && (
              <button
                onClick={() => { setOsmResults([]); setSearchQuery(''); setShowPocketOnly(false); }}
                className="ml-auto text-[11px] font-bold text-[#9E4B58]"
              >
                清除搜尋
              </button>
            )}
          </div>

          {displayPlaces.length === 0 && (
            <div className="p-5 rounded-2xl bg-[#FBF8F3] text-center text-xs text-[#9A9086]">
              {osmResults.length > 0 && showPocketOnly || osmResults.length === 0
                ? '收藏名單還是空的，搜尋地點後按「📌 存口袋」，或用上方「手動新增」建立！'
                : '沒有符合此分類的地點'}
            </div>
          )}

          <div className="space-y-2.5">
            {displayPlaces.map((place) => {
              const scheduledDaysFor = (pl) => {
                const days = [];
                Object.keys(trip.itinerary || {}).forEach((d) => {
                  const hit = (trip.itinerary[d] || []).some(
                    (st) => st.name === pl.name &&
                      (!pl.lat || !st.lat || (Math.abs(st.lat - pl.lat) < 0.0005 && Math.abs(st.lng - pl.lng) < 0.0005))
                  );
                  if (hit) days.push(Number(d));
                });
                return days.sort((x, y) => x - y);
              };
              const distFromHotel = trip.hotel ? calcDistanceKm(trip.hotel.lat, trip.hotel.lng, place.lat, place.lng) : null;
              return (
                <div
                  key={place.id}
                  className="rounded-[26px] bg-[#FFFDF9] border border-[#E6DFD3] p-4 shadow-2xs space-y-2"
                >
                  <div>
                    <div className="flex items-center gap-1.5 flex-wrap">
                      <span className="px-2 py-0.5 rounded-full bg-[#F9EED7] text-[#8F6B29] text-[10px] font-bold">
                        {getCategoryEmoji(place.category)} {place.category}
                      </span>
                      {distFromHotel !== null && (
                        <span className="text-[11px] text-[#8C8278]">距飯店 {distFromHotel} km</span>
                      )}
                      {scheduledDaysFor(place).length > 0 && (
                        <span className="px-2 py-0.5 rounded-full bg-[#DDEFD9] text-[#3F7A3A] text-[10px] font-black">
                          ✅ 已排入 {scheduledDaysFor(place).map((d) => `Day ${d}`).join('、')}
                        </span>
                      )}
                    </div>
                    <h4 className="text-sm font-black text-[#4A443F] mt-1">{place.name}</h4>
                    {place.isOsm ? (
                      <p className="text-[11px] text-[#9A9086] mt-0.5">{place.address}</p>
                    ) : (
                      place.note && (
                        <div className="mt-1.5 text-xs text-[#6E655D] bg-[#FBF8F3] px-3 py-1.5 rounded-xl border border-[#EFE9DE]">
                          {place.note}
                        </div>
                      )
                    )}
                  </div>

                  <div className="pt-2 border-t border-[#F0EAE0] flex items-center gap-2">
                    <button
                      onClick={() => onAddSpot(place, 'day', selectedDay)}
                      className="flex-1 py-1.5 px-3 rounded-full bg-[#F7DCE0] text-[#9E4B58] text-xs font-black border border-[#E8C3C9] active:scale-95 transition truncate"
                    >
                      ＋ 排入 Day {selectedDay}
                    </button>
                    {!place.isOsm && (
                      <button
                        onClick={() => onEditSpot && onEditSpot(place)}
                        className="py-1.5 px-3 rounded-full bg-[#F9EED7] text-[#8F6B29] text-xs font-bold active:scale-95 transition shrink-0"
                      >
                        ✎ 編輯
                      </button>
                    )}
                    {place.isOsm && (
                      <button
                        onClick={() => onAddSpot(place, 'pocket')}
                        className="py-1.5 px-3 rounded-full bg-[#F9EED7] text-[#8F6B29] text-xs font-bold active:scale-95 transition shrink-0"
                      >
                        📌 存口袋
                      </button>
                    )}
                    <a
                      href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name + ' ' + trip.city)}`}
                      target="_blank"
                      rel="noreferrer"
                      className="py-1.5 px-3 rounded-full bg-[#DCECF7]/70 text-[#3F7396] text-xs font-bold shrink-0"
                    >
                      導航 ↗
                    </a>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 11. 分頁五：工具箱 (Toolkit)
    //     - 購物清單支援「編輯」與「刪除」
    //     - 擴充常用翻譯庫（20+ 句多情境）
    //     - 匯率換算與插座緊急合併（顯示完整國旗與中文幣別）
    // =========================================================================
    function ToolkitView({
      trip,
      country,
      countriesDB,
      updateTrip,
      activeTool,
      setActiveTool,
      cashStats,
      liveRatesToTWD,
      rateUpdatedTime,
      onRefreshRate,
      shoppingCategories,
      luggageCategories,
      selectedDay,
      showToast
    }) {
      const [newPackItem, setNewPackItem] = useState('');
      const [newPackCat, setNewPackCat] = useState(luggageCategories[0] || '日常類');
      const [packFilter, setPackFilter] = useState('全部');
      const [zoomPhrase, setZoomPhrase] = useState(null);

      const [newShopName, setNewShopName] = useState('');
      const [newShopPrice, setNewShopPrice] = useState('');
      const [newShopStore, setNewShopStore] = useState('');
      const [newShopCat, setNewShopCat] = useState(shoppingCategories[0] || '藥妝');
      const [newShopNote, setNewShopNote] = useState('');
      const [newShopImage, setNewShopImage] = useState('');
      const [confirmShopItem, setConfirmShopItem] = useState(null);
      const [editingShopItem, setEditingShopItem] = useState(null);

      // 匯率換算器
      const [convAmount, setConvAmount] = useState('10000');
      const [convFrom, setConvFrom] = useState(trip.currency);
      const [convTo, setConvTo] = useState('TWD');

      // 翻譯分類
      const phraseCats = useMemo(() => {
        const unique = ['全部'];
        (country.phrases || []).forEach((p) => {
          if (!unique.includes(p.cat)) unique.push(p.cat);
        });
        return unique;
      }, [country]);
      const [selectedPhraseCat, setSelectedPhraseCat] = useState('全部');

      useEffect(() => {
        setConvFrom(trip.currency);
      }, [trip.currency]);

      useEffect(() => {
        setSelectedPhraseCat('全部');
      }, [country.id]);

      const togglePackItem = (id) => {
        updateTrip((t) => ({
          ...t,
          packingList: t.packingList.map((i) => (i.id === id ? { ...i, checked: !i.checked } : i)),
        }));
      };

      const handleAddPack = (e) => {
        e.preventDefault();
        if (!newPackItem.trim()) return;
        updateTrip((t) => ({
          ...t,
          packingList: [
            ...t.packingList,
            { id: `pack-${Date.now()}`, category: newPackCat, name: newPackItem.trim(), checked: false },
          ],
        }));
        setNewPackItem('');
        showToast('已新增行李檢查項目');
      };

      const handleShopPhotoImport = (e, isEdit = false) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          if (isEdit && editingShopItem) {
            setEditingShopItem((prev) => ({ ...prev, imageUrl: reader.result }));
          } else {
            setNewShopImage(reader.result);
          }
          showToast('已導入商品圖片 📷');
        };
        reader.readAsDataURL(file);
      };

      const handleAddShop = (e) => {
        e.preventDefault();
        if (!newShopName.trim()) return;
        updateTrip((t) => ({
          ...t,
          shoppingList: [
            {
              id: `shop-${Date.now()}`,
              name: newShopName.trim(),
              category: newShopCat,
              store: newShopStore.trim() || `${t.city}商店`,
              foreignPrice: Number(newShopPrice) || 1000,
              note: newShopNote.trim(),
              purchased: false,
              recorded: false,
              imageUrl: newShopImage,
            },
            ...t.shoppingList,
          ],
        }));
        setNewShopName('');
        setNewShopPrice('');
        setNewShopStore('');
        setNewShopNote('');
        setNewShopImage('');
        showToast('已加入必買購物清單 🛍️');
      };

      const handleSaveShopEdit = (e) => {
        e.preventDefault();
        if (!editingShopItem || !editingShopItem.name.trim()) return;
        updateTrip((t) => ({
          ...t,
          shoppingList: t.shoppingList.map((s) =>
            s.id === editingShopItem.id
              ? {
                  ...editingShopItem,
                  name: editingShopItem.name.trim(),
                  foreignPrice: Number(editingShopItem.foreignPrice) || 0,
                }
              : s
          ),
        }));
        setEditingShopItem(null);
        showToast('已更新購物項目 ✨');
      };

      const handleDeleteShopItem = (shopId) => {
        updateTrip((t) => ({
          ...t,
          shoppingList: t.shoppingList.filter((s) => s.id !== shopId),
        }));
        showToast('已刪除該購物項目');
      };

      const handleConfirmShopToAccounting = (item, payMethod) => {
        const liveRate = liveRatesToTWD[trip.currency] || country.defaultRate || 0.2155;
        const rateUsed = payMethod === 'cash' ? cashStats.avgLockedRate : liveRate;
        const twdVal = Math.round(item.foreignPrice * rateUsed * (payMethod === 'card' ? 1.015 : 1));

        const newExpense = {
          id: `exp-shop-${Date.now()}`,
          day: selectedDay,
          title: `🛍️ ${item.name}`,
          category: '購物',
          foreignAmount: item.foreignPrice,
          method: payMethod,
          lockedRate: rateUsed,
          feeIncluded: payMethod === 'card',
          twdAmount: twdVal,
          note: `購於 ${item.store}`,
        };

        updateTrip((t) => ({
          ...t,
          shoppingList: t.shoppingList.map((s) =>
            s.id === item.id ? { ...s, purchased: true, recorded: true } : s
          ),
          expenses: [newExpense, ...t.expenses],
        }));
        setConfirmShopItem(null);
        showToast(`已打勾「${item.name}」並自動寫入記帳本！`);
      };

      // 建立不重複幣別選項清單（含台灣台幣 + 所有 countriesDB 幣別）
      const allCurrencyOptions = useMemo(() => {
        const seen = new Set();
        const list = [];
        countriesDB.forEach((c) => {
          if (!seen.has(c.currency)) {
            seen.add(c.currency);
            list.push({
              code: c.currency,
              flag: c.flag,
              zhName: c.currencyZh,
            });
          }
        });
        if (!seen.has('TWD')) {
          list.unshift({ code: 'TWD', flag: '🇹🇼', zhName: '台幣' });
        }
        return list;
      }, [countriesDB]);

      const convertedVal = useMemo(() => {
        const amt = Number(convAmount) || 0;
        const fromRateToTwd = liveRatesToTWD[convFrom] || 1;
        const toRateToTwd = liveRatesToTWD[convTo] || 1;
        const result = (amt * fromRateToTwd) / toRateToTwd;
        return result >= 100 ? Math.round(result).toLocaleString() : result.toFixed(2);
      }, [convAmount, convFrom, convTo, liveRatesToTWD]);

      const packDone = trip.packingList.filter((i) => i.checked).length;
      const packTotal = trip.packingList.length;
      const packPct = packTotal > 0 ? Math.round((packDone / packTotal) * 100) : 0;

      const filteredPhrases = useMemo(() => {
        const all = country.phrases || [];
        if (selectedPhraseCat === '全部') return all;
        return all.filter((p) => p.cat === selectedPhraseCat);
      }, [country, selectedPhraseCat]);

      return (
        <div className="space-y-3.5 animate-card">
          {/* 工具箱 4 大分頁膠囊列 */}
          <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            {[
              { id: 'packing', label: '🧳 行李清單' },
              { id: 'shopping', label: '🛍️ 購物清單' },
              { id: 'ratePlug', label: '💱 匯率與插座緊急' },
              { id: 'phrases', label: `🗣️ ${country.name}翻譯` },
            ].map((t) => (
              <button
                key={t.id}
                onClick={() => setActiveTool(t.id)}
                className={`px-3.5 py-1.5 rounded-full text-xs font-black whitespace-nowrap transition shrink-0 ${
                  activeTool === t.id
                    ? 'bg-[#D67A88] text-white shadow-2xs'
                    : 'bg-[#FFFDF9] text-[#7D746B] border border-[#E6DFD3]'
                }`}
              >
                {t.label}
              </button>
            ))}
          </div>

          {/* 1. 行李檢查清單 */}
          {activeTool === 'packing' && (
            <div className="space-y-3">
              <div className="rounded-[26px] bg-[#F7DCE0] border border-[#E8C3C9] p-4">
                <div className="flex justify-between items-center text-xs font-black text-[#7A3540] mb-1.5">
                  <span>行李準備進度</span>
                  <span>{packDone} / {packTotal} ({packPct}%)</span>
                </div>
                <div className="w-full h-3 bg-[#FFFDF9] rounded-full overflow-hidden p-0.5">
                  <div className="h-full bg-[#D67A88] rounded-full transition-all duration-500" style={{ width: `${packPct}%` }} />
                </div>
              </div>

              <form onSubmit={handleAddPack} className="flex gap-1.5">
                <select
                  value={newPackCat}
                  onChange={(e) => setNewPackCat(e.target.value)}
                  className="px-2.5 py-2 rounded-2xl bg-[#FFFDF9] border border-[#E6DFD3] text-xs font-bold shrink-0"
                >
                  {luggageCategories.map((c) => (
                    <option key={c} value={c}>{c}</option>
                  ))}
                </select>
                <input
                  type="text"
                  placeholder="新增行李項目..."
                  value={newPackItem}
                  onChange={(e) => setNewPackItem(e.target.value)}
                  className="flex-1 min-w-0 px-3 py-2 rounded-2xl bg-[#FFFDF9] border border-[#E6DFD3] text-xs"
                />

    // =========================================================================
    // 12. 獨立「票券管理頁面」：管理、新增、編輯、刪除所有票券（機票採登機證造型）
    // =========================================================================
    function TicketsManagerView({ trip, updateTrip, onOpenPreview, onBack, showToast }) {
      const [filterKind, setFilterKind] = useState('all'); // all | flight | hotel | attraction | transit
      const [showFormModal, setShowFormModal] = useState(false);
      const [editingTicket, setEditingTicket] = useState(null);

      const tickets = trip.tickets || [];

      const filteredTickets = useMemo(() => {
        const base = filterKind === 'all' ? tickets : tickets.filter((t) => t.kind === filterKind);
        const rank = (t) => (t.kind !== 'flight' ? 3 : { outbound: 0, return: 2 }[getFlightDir(t)] ?? 1);
        return [...base].sort((a, b) => rank(a) - rank(b));
      }, [tickets, filterKind]);

      const handleOpenAdd = () => {
        setEditingTicket({
          id: '',
          kind: 'flight',
          direction: 'outbound',
          title: '',
          airline: '',
          flightNo: '',
          fromCode: 'TPE',
          fromName: '台北桃園',
          toCode: trip.countryId || 'NRT',
          toName: trip.city,
          date: trip.startDate,
          depTime: '09:00',
          arrTime: '12:30',
          gate: 'A1',
          terminal: 'T1',
          seat: '12A',
          subtitle: '',
          code: `TKT-${Math.floor(100000 + Math.random() * 900000)}`,
          note: '',
          imageUrl: '',
        });
        setShowFormModal(true);
      };

      const handleOpenEdit = (tkt) => {
        setEditingTicket({ ...tkt });
        setShowFormModal(true);
      };

      const handleDeleteTicket = (tktId) => {
        updateTrip((t) => ({
          ...t,
          tickets: (t.tickets || []).filter((item) => item.id !== tktId),
        }));
        showToast('已刪除該電子票券');
      };

      const handleSaveTicket = (e) => {
        e.preventDefault();
        if (!editingTicket) return;
        const autoTitle =
          editingTicket.title.trim() ||
          (editingTicket.kind === 'flight'
            ? `${editingTicket.airline || '航班'} ${(FLIGHT_DIRS.find((d) => d.id === editingTicket.direction) || {}).label || ''} ${editingTicket.flightNo || ''}`.replace(/\s+/g, ' ').trim()
            : '電子票券憑證');

        const finalObj = { ...editingTicket, title: autoTitle };

        if (finalObj.id) {
          updateTrip((t) => ({
            ...t,
            tickets: (t.tickets || []).map((item) => (item.id === finalObj.id ? finalObj : item)),
          }));
          showToast('已更新票券內容 ✨');
        } else {
          finalObj.id = `tkt-${Date.now()}`;
          updateTrip((t) => ({
            ...t,
            tickets: [finalObj, ...(t.tickets || [])],
          }));
          showToast('已新增電子票券至票夾 🎫');
        }
        setShowFormModal(false);
        setEditingTicket(null);
      };

      const handleTicketImageUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          setEditingTicket((prev) => ({ ...prev, imageUrl: reader.result }));
          showToast('已附加票券圖片 / PDF 截圖');
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="space-y-3.5 animate-card">
          <div className="flex items-center justify-between gap-2">
            <div>
              <h2 className="text-base font-black text-[#4A443F]">🎫 離線電子票券夾</h2>
              <p className="text-[11px] text-[#8C8278]">無網路亦可秒開登機證、訂房與門票</p>
            </div>
            <button
              onClick={handleOpenAdd}
              className="px-3.5 py-2 rounded-full bg-[#D67A88] text-white text-xs font-black shadow-2xs active:scale-95 shrink-0"
            >
              ＋ 新增票券
            </button>
          </div>

          {/* 票券類型篩選膠囊 */}
          <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            {[
              { id: 'all', label: `全部 (${tickets.length})` },
              { id: 'flight', label: '✈️ 機票' },
              { id: 'hotel', label: '🏨 飯店住宿' },
              { id: 'attraction', label: '🎟️ 景點門票' },
              { id: 'transit', label: '🚃 交通票券' },
            ].map((tab) => (
              <button
                key={tab.id}
                onClick={() => setFilterKind(tab.id)}
                className={`px-3 py-1 rounded-full text-[11px] font-bold whitespace-nowrap shrink-0 ${
                  filterKind === tab.id
                    ? 'bg-[#F9EED7] text-[#8F6B29] border border-[#E8D5AF]'
                    : 'bg-[#FFFDF9] text-[#7D746B] border border-[#E6DFD3]'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* 票券卡片列表 */}
          {filteredTickets.length === 0 ? (
            <div className="rounded-[26px] bg-[#FFFDF9] border-2 border-dashed border-[#E6DFD3] p-6 text-center space-y-2">
              <div className="text-2xl">🎫</div>
              <div className="text-xs font-bold text-[#7D746B]">此分類尚無票券紀錄</div>
              <button
                onClick={handleOpenAdd}
                className="px-4 py-1.5 rounded-full bg-[#F7DCE0] text-[#9E4B58] text-xs font-bold"
              >
                ＋ 立即新增一張票券
              </button>
            </div>
          ) : (
            <div className="space-y-3">
              {filteredTickets.map((tkt) =>
                tkt.kind === 'flight' ? (
                  <BoardingPassCard
                    key={tkt.id}
                    ticket={tkt}
                    onOpenPreview={onOpenPreview}
                    onEdit={handleOpenEdit}
                    onDelete={handleDeleteTicket}
                  />
                ) : (
                  <div
                    key={tkt.id}
                    className="rounded-[26px] bg-[#FFFDF9] border border-[#E6DFD3] p-4 shadow-2xs space-y-2.5"
                  >
                    <div className="flex items-start justify-between gap-2">
                      <div className="min-w-0">
                        <span className="px-2.5 py-0.5 rounded-full bg-[#F9EED7] text-[#8F6B29] text-[10px] font-black">
                          {tkt.kind === 'hotel' ? '🏨 飯店住宿' : tkt.kind === 'transit' ? '🚃 交通票券' : '🎟️ 景點門票'}
                        </span>
                        <h4 className="text-sm font-black text-[#4A443F] mt-1.5">{tkt.title}</h4>
                        {tkt.subtitle && <div className="text-xs text-[#7D746B] mt-0.5">{tkt.subtitle}</div>}
                      </div>
                      <span className="font-mono text-[10px] font-black bg-[#FBF8F3] px-2.5 py-1 rounded-full border border-[#E6DFD3] text-[#6E655D] shrink-0">
                        {tkt.code}
                      </span>
                    </div>

                    {tkt.note && (
                      <div className="text-[11px] text-[#7D746B] bg-[#FBF8F3] px-3 py-1.5 rounded-xl border border-[#EFE9DE]">
                        {tkt.note}
                      </div>
                    )}

                    <div className="pt-2 border-t border-[#F0EAE0] flex items-center justify-between gap-2">
                      <div className="flex items-center gap-1.5">
                        <button
                          onClick={() => handleOpenEdit(tkt)}
                          className="px-2.5 py-1 rounded-full bg-[#F9EED7] text-[#8F6B29] text-[11px] font-bold"
                        >
                          ✎ 編輯
                        </button>
                        <button
                          onClick={() => handleDeleteTicket(tkt.id)}
                          className="px-2.5 py-1 rounded-full bg-[#F5F0E6] text-[#9E4B58] text-[11px] font-bold"
                        >
                          刪除
                        </button>
                      </div>
                      <button
                        onClick={() => onOpenPreview(tkt)}
                        className="px-3.5 py-1.5 rounded-full bg-[#D67A88] text-white text-xs font-black active:scale-95"
                      >
                        開啟 QR 亮屏 ↗
                      </button>
                    </div>
                  </div>
                )
              )}
            </div>
          )}

          {/* 新增 / 編輯票券彈窗 */}
          {showFormModal && editingTicket && ReactDOM.createPortal(
            <div className="fixed inset-0 bg-[#4A443F]/45 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
              <form
                onSubmit={handleSaveTicket}
                className="w-full max-w-md max-h-[86vh] max-h-[86dvh] overflow-y-auto rounded-[30px] bg-[#FFFDF9] border border-[#E6DFD3] p-5 shadow-2xl space-y-3 animate-card"
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-black text-[#4A443F]">
                    {editingTicket.id ? '✎ 編輯電子票券' : '🎫 新增電子票券'}
                  </h3>
                  <button type="button" onClick={() => setShowFormModal(false)} className="w-7 h-7 rounded-full bg-[#F5F0E6] text-xs font-bold">✕</button>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-[#7D746B]">票券類型</label>
                  <div className="grid grid-cols-4 gap-1.5 mt-1">
                    {[
                      { id: 'flight', label: '✈️ 機票' },
                      { id: 'hotel', label: '🏨 飯店' },
                      { id: 'attraction', label: '🎟️ 門票' },
                      { id: 'transit', label: '🚃 交通' },
                    ].map((k) => (
                      <button
                        type="button"
                        key={k.id}
                        onClick={() => setEditingTicket({ ...editingTicket, kind: k.id })}
                        className={`py-1.5 rounded-2xl text-[11px] font-black border ${
                          editingTicket.kind === k.id
                            ? 'bg-[#D67A88] text-white border-[#D67A88]'
                            : 'bg-[#FBF8F3] text-[#7D746B] border-[#E6DFD3]'
                        }`}
                      >
                        {k.label}
                      </button>
                    ))}
                  </div>
                </div>

                {editingTicket.kind === 'flight' ? (
                  <>
                    <div>
                      <label className="text-[11px] font-bold text-[#7D746B]">航程方向</label>
                      <div className="grid grid-cols-3 gap-2 mt-1">
                        {FLIGHT_DIRS.map((d) => {
                          const active = (editingTicket.direction || '') === d.id;
                          return (
                            <button
                              key={d.id}
                              type="button"
                              onClick={() => {
                                if (editingTicket.direction === d.id) return;
                                const next = { ...editingTicket, direction: d.id };
                                const swap = (d.id === 'return' && editingTicket.direction !== 'return') || (d.id === 'outbound' && editingTicket.direction === 'return');
                                if (swap && !editingTicket.id) {
                                  next.fromCode = editingTicket.toCode;
                                  next.fromName = editingTicket.toName;
                                  next.toCode = editingTicket.fromCode;
                                  next.toName = editingTicket.fromName;
                                  next.date = d.id === 'return' ? (trip.endDate || editingTicket.date) : (trip.startDate || editingTicket.date);
                                }
                                setEditingTicket(next);
                              }}
                              className={`py-2 rounded-2xl text-xs font-black border transition active:scale-95 ${active ? 'bg-[#D67A88] text-white border-[#D67A88]' : 'bg-[#FBF8F3] text-[#7D746B] border-[#E6DFD3]'}`}
                            >
                              {d.icon} {d.label}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[11px] font-bold text-[#7D746B]">航空公司</label>
                        <input
                          type="text"
                          required
                          placeholder="例如：星宇航空"
                          value={editingTicket.airline || ''}
                          onChange={(e) => setEditingTicket({ ...editingTicket, airline: e.target.value })}
                          className="w-full mt-1 px-3 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-[#7D746B]">航班編號</label>
                        <input
                          type="text"
                          required
                          placeholder="例如：JX800"
                          value={editingTicket.flightNo || ''}
                          onChange={(e) => setEditingTicket({ ...editingTicket, flightNo: e.target.value })}
                          className="w-full mt-1 px-3 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-black"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[11px] font-bold text-[#7D746B]">出發機場代碼 (如 TPE)</label>
                        <input
                          type="text"
                          required
                          maxLength="4"
                          value={editingTicket.fromCode || ''}
                          onChange={(e) => setEditingTicket({ ...editingTicket, fromCode: e.target.value.toUpperCase() })}
                          className="w-full mt-1 px-3 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-black"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-[#7D746B]">抵達機場代碼 (如 NRT)</label>
                        <input
                          type="text"
                          required
                          maxLength="4"
                          value={editingTicket.toCode || ''}
                          onChange={(e) => setEditingTicket({ ...editingTicket, toCode: e.target.value.toUpperCase() })}
                          className="w-full mt-1 px-3 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-black"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <input
                        type="text"
                        placeholder="出發機場名稱"
                        value={editingTicket.fromName || ''}
                        onChange={(e) => setEditingTicket({ ...editingTicket, fromName: e.target.value })}
                        className="px-3 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs"
                      />
                      <input
                        type="text"
                        placeholder="抵達機場名稱"
                        value={editingTicket.toName || ''}
                        onChange={(e) => setEditingTicket({ ...editingTicket, toName: e.target.value })}
                        className="px-3 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div className="min-w-0">
                        <label className="text-[11px] font-bold text-[#7D746B]">起飛時間</label>
                        <input
                          type="time"
                          value={editingTicket.depTime || '08:30'}
                          onChange={(e) => setEditingTicket({ ...editingTicket, depTime: e.target.value })}
                          className="tk-field w-full mt-1 px-3 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                        />
                      </div>
                      <div className="min-w-0">
                        <label className="text-[11px] font-bold text-[#7D746B]">抵達時間</label>
                        <input
                          type="time"
                          value={editingTicket.arrTime || '12:30'}
                          onChange={(e) => setEditingTicket({ ...editingTicket, arrTime: e.target.value })}
                          className="tk-field w-full mt-1 px-3 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-2">
                      <div className="min-w-0">
                        <label className="text-[11px] font-bold text-[#7D746B]">座位號碼</label>
                        <input
                          type="text"
                          placeholder="14A"
                          value={editingTicket.seat || ''}
                          onChange={(e) => setEditingTicket({ ...editingTicket, seat: e.target.value })}
                          className="tk-field w-full mt-1 px-3 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                        />
                      </div>
                      <div className="min-w-0">
                        <label className="text-[11px] font-bold text-[#7D746B]">航廈</label>
                        <input
                          type="text"
                          placeholder="T1"
                          value={editingTicket.terminal || ''}
                          onChange={(e) => setEditingTicket({ ...editingTicket, terminal: e.target.value })}
                          className="tk-field w-full mt-1 px-3 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                        />
                      </div>
                      <div className="min-w-0">
                        <label className="text-[11px] font-bold text-[#7D746B]">登機門</label>
                        <input
                          type="text"
                          placeholder="B6"
                          value={editingTicket.gate || ''}
                          onChange={(e) => setEditingTicket({ ...editingTicket, gate: e.target.value })}
                          className="tk-field w-full mt-1 px-3 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                        />
                      </div>
                    </div>

                    <div className="min-w-0">
                      <label className="text-[11px] font-bold text-[#7D746B]">出發日期</label>
                      <input
                        type="date"
                        value={editingTicket.date || trip.startDate}
                        onChange={(e) => setEditingTicket({ ...editingTicket, date: e.target.value })}
                        className="tk-field w-full mt-1 px-3 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                      />
                    </div>
                  </>
                ) : (
                  <>
                    <div>
                      <label className="text-[11px] font-bold text-[#7D746B]">票券 / 飯店名稱</label>
                      <input
                        type="text"
                        required
                        placeholder="例如：環球影城快速通關、飯店確認單"
                        value={editingTicket.title || ''}
                        onChange={(e) => setEditingTicket({ ...editingTicket, title: e.target.value })}
                        className="w-full mt-1 px-3.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-bold"
                      />
                    </div>
                    <input
                      type="text"
                      placeholder="場次 / 房型 / 副標題說明"
                      value={editingTicket.subtitle || ''}
                      onChange={(e) => setEditingTicket({ ...editingTicket, subtitle: e.target.value })}
                      className="w-full px-3.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs"
                    />
                  </>
                )}

                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    placeholder="電子票號 / 訂位代號"
                    value={editingTicket.code || ''}
                    onChange={(e) => setEditingTicket({ ...editingTicket, code: e.target.value })}
                    className="px-3 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs font-mono font-bold"
                  />
                  <label className="px-3 py-2 rounded-2xl bg-[#F9EED7] text-[#8F6B29] text-xs font-bold text-center cursor-pointer border border-[#E8D5AF]">
                    📎 上傳截圖/QR
                    <input type="file" accept="image/*" onChange={handleTicketImageUpload} className="hidden" />
                  </label>
                </div>

                <input
                  type="text"
                  placeholder="備註 (行李額度、兌換地點等)"
                  value={editingTicket.note || ''}
                  onChange={(e) => setEditingTicket({ ...editingTicket, note: e.target.value })}
                  className="w-full px-3.5 py-2 rounded-2xl bg-[#FBF8F3] border border-[#E6DFD3] text-xs"
                />

                <button type="submit" className="w-full py-2.5 rounded-full bg-[#D67A88] text-white text-xs font-black">
                  儲存票券
                </button>
              </form>
            </div>
          , document.body)}
        </div>
      );
    }

    // =========================================================================
    // 13. 設定 Modal（分類管理、預設行李、票券管理入口、自訂新增國家、編輯/刪除行程）
    // =========================================================================
    function SettingsModal({
      settings,
      trips,
      activeTripId,
      countriesDB,
      onSaveSettings,
      onSyncDefaultPackingToTrip,
      onExportBackup,
      onImportBackup,
      onOpenTicketManager,
      onAddCustomCountry,
      onUpdateTripMeta,
      onDeleteTrip,
      onSelectTrip,
      onClose
    }) {
      const [draft, setDraft] = useState(() => JSON.parse(JSON.stringify(settings)));
      const [section, setSection] = useState('trips'); // trips | countries | shopping | luggage | spot | defaultPacking

      // 分類編輯狀態
      const [newCategoryText, setNewCategoryText] = useState('');
      const [editingCatIdx, setEditingCatIdx] = useState(null);
      const [editingCatValue, setEditingCatValue] = useState('');

      // 預設行李編輯狀態
      const [newDefPackName, setNewDefPackName] = useState('');
      const [newDefPackCat, setNewDefPackCat] = useState(draft.luggageCategories[0] || '日常類');
      const [editingDefPackId, setEditingDefPackId] = useState(null);
      const [editingDefPackName, setEditingDefPackName] = useState('');
      const [editingDefPackCat, setEditingDefPackCat] = useState('');
      const [defFilter, setDefFilter] = useState('全部');

      // 編輯行程狀態
      const [editingTripForm, setEditingTripForm] = useState(null);

      // 新增自訂國家狀態
      const [newCountryName, setNewCountryName] = useState('');
      const [newCountryFlag, setNewCountryFlag] = useState('🏳️');
      const [newCountryCurr, setNewCountryCurr] = useState('');
      const [newCountryCurrZh, setNewCountryCurrZh] = useState('');
      const [newCountrySymbol, setNewCountrySymbol] = useState('$');
      const [newCountryRate, setNewCountryRate] = useState('1.0');
      const [newCountryPlug, setNewCountryPlug] = useState('萬國轉接頭 / 220V');
      const [newCountryPolice, setNewCountryPolice] = useState('110');
      const [newCountryCity, setNewCountryCity] = useState('');

      const getCatKey = () => {
        if (section === 'shopping') return 'shoppingCategories';
        if (section === 'luggage') return 'luggageCategories';
        return 'spotCategories';
      };

      const handleAddCategory = (e) => {
        e.preventDefault();
        const val = newCategoryText.trim();
        if (!val) return;
        const key = getCatKey();
        if (draft[key].includes(val)) return;
        setDraft((prev) => ({ ...prev, [key]: [...prev[key], val] }));
        setNewCategoryText('');
      };

      const handleSaveCategoryEdit = (idx) => {
        const val = editingCatValue.trim();
        if (!val) return;
        const key = getCatKey();
        setDraft((prev) => {
          const nextArr = [...prev[key]];
          nextArr[idx] = val;
          return { ...prev, [key]: nextArr };
        });
        setEditingCatIdx(null);
        setEditingCatValue('');
      };

      const handleDeleteCategory = (idx) => {
        const key = getCatKey();
        setDraft((prev) => ({
          ...prev,
          [key]: prev[key].filter((_, i) => i !== idx),
        }));
      };

      const handleAddDefaultPacking = (e) => {
        e.preventDefault();
        if (!newDefPackName.trim()) return;
        setDraft((prev) => ({
          ...prev,
          defaultLuggageItems: [
            ...prev.defaultLuggageItems,
            {
              id: `def-${Date.now()}`,
              category: newDefPackCat,
              name: newDefPackName.trim(),
            },
          ],
        }));
        setNewDefPackName('');
      };

      const handleSaveDefaultPackingEdit = (id) => {
        if (!editingDefPackName.trim()) return;
        setDraft((prev) => ({
          ...prev,
          defaultLuggageItems: prev.defaultLuggageItems.map((item) =>
            item.id === id ? { ...item, name: editingDefPackName.trim(), category: editingDefPackCat || item.category } : item
          ),
        }));
        setEditingDefPackId(null);
      };

      const handleDeleteDefaultPacking = (id) => {
        setDraft((prev) => ({
          ...prev,
